<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>BOMB WMS｜倉儲與資產管理系統</title>
<link rel="stylesheet" href="assets/wms.css">

<style>
  /* 保留目前已完成的首頁與書籤樣式 */
  #page-dashboard{--dash-surface:#fff;--dash-border:#e2e8f0;--dash-muted:#64748b;--dash-shadow:0 10px 28px rgba(25,42,75,.05)}
  html[data-theme="dark"] #page-dashboard{--dash-surface:#171e29;--dash-border:#2d394b;--dash-muted:#9bb0cc;--dash-shadow:0 12px 30px rgba(0,0,0,.11)}
  #page-dashboard .wms-dashboard-section-title{margin:24px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  #page-dashboard .wms-dashboard-section-title h2{margin:0;font-size:18px;font-weight:750;letter-spacing:.02em}
  #page-dashboard .wms-dashboard-section-title p{margin:0;color:var(--dash-muted);font-size:13px}
  #page-dashboard .wms-dashboard-focus{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0 0 26px}
  #page-dashboard .wms-dashboard-focus .wms-kpi{--kpi-accent:#6275dc;--kpi-tint:rgba(98,117,220,.13);position:relative;isolation:isolate;min-width:0;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;padding:19px 20px;border:1px solid var(--dash-border);border-radius:18px;background:linear-gradient(145deg,var(--kpi-tint),transparent 62%),var(--dash-surface);box-shadow:var(--dash-shadow);transition:transform .18s ease,box-shadow .18s ease}
  #page-dashboard .wms-dashboard-focus .wms-kpi:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(25,42,75,.12)}
  #page-dashboard .wms-kpi--stocked{--kpi-accent:#1eaa78;--kpi-tint:rgba(30,170,120,.12)}
  #page-dashboard .wms-kpi--inspection{--kpi-accent:#d8962d;--kpi-tint:rgba(216,150,45,.14)}
  #page-dashboard .wms-kpi--order{--kpi-accent:#9970d8;--kpi-tint:rgba(153,112,216,.14)}
  #page-dashboard .wms-kpi .stat-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #page-dashboard .wms-kpi .stat-label{font-size:14px;font-weight:650}
  #page-dashboard .wms-kpi .stat-icon{display:grid;place-items:center;width:48px;height:48px;flex:0 0 48px;border:1px solid color-mix(in srgb,var(--kpi-accent) 18%,transparent);border-radius:14px;background:var(--kpi-tint);color:var(--kpi-accent)}
  #page-dashboard .wms-kpi .stat-icon svg{display:block;width:26px;height:26px}
  #page-dashboard .wms-kpi .stat-value{margin-top:8px;font-size:36px;line-height:1.1;font-weight:760;letter-spacing:-.035em}
  #page-dashboard .wms-kpi .stat-note{margin-top:7px;color:var(--dash-muted);font-size:12px;line-height:1.45}
  #page-dashboard .dashboard-grid>div{display:flex;flex-direction:column;gap:16px;min-width:0}
  #page-dashboard .dashboard-grid>div>br{display:none}
  #page-dashboard .dashboard-grid .card{overflow:hidden;border:1px solid var(--dash-border);border-radius:18px;background:var(--dash-surface);box-shadow:var(--dash-shadow)}
  #page-dashboard .dashboard-grid .card-header{padding:17px 19px}
  #page-dashboard .dashboard-grid .card-body{padding:18px 19px}
  #page-dashboard .dashboard-grid .wms-card-footer{border-top:1px solid var(--dash-border)}
  #page-dashboard .dashboard-grid .alert-list{display:grid;gap:9px}
  #page-dashboard .dashboard-grid .alert-item{margin:0;border-radius:12px}
  #page-dashboard .dashboard-grid .alert-icon{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px}
  #page-dashboard .dashboard-grid .alert-icon svg{display:block;width:19px;height:19px}

  .wms-book-nav{display:block!important;padding:10px 16px 0!important;background:transparent!important;border:0!important}
  .wms-book-nav .sheet-tabs{display:flex!important;align-items:flex-end!important;min-height:66px;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:thin;padding:11px 4px 0!important;gap:0!important}
  .wms-book-nav .sheet-tab{--book-fill:#f8fafc;--book-line:#cad5e2;position:relative!important;isolation:isolate;display:flex!important;align-items:center;justify-content:center;flex:0 0 auto!important;min-width:163px;height:53px!important;margin:0 -19px 0 0!important;padding:0 32px 0 17px!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:#4b5f75!important;font-size:14px!important;font-weight:650!important;white-space:nowrap;transform:none;transition:transform .16s ease,color .16s ease}
  .wms-book-nav .sheet-tab:nth-child(1){z-index:7}
  .wms-book-nav .sheet-tab:nth-child(2){z-index:6}
  .wms-book-nav .sheet-tab:nth-child(3){z-index:5}
  .wms-book-nav .sheet-tab:nth-child(4){z-index:4}
  .wms-book-nav .sheet-tab:nth-child(5){z-index:3}
  .wms-book-nav .sheet-tab:nth-child(6){z-index:2}
  .wms-book-nav .sheet-tab:nth-child(7){z-index:1}
  .wms-book-nav .sheet-tab:hover{--book-fill:#eaf3fc;transform:translateY(-2px)}
  .wms-book-nav .sheet-tab::before,.wms-book-nav .sheet-tab::after{content:none!important;display:none!important}
  .wms-book-nav .sheet-tab.active{--book-fill:#246da8;--book-line:#246da8;z-index:20!important;color:#fff!important;transform:translateY(-7px)}
  .wms-book-nav .sheet-tab:focus-visible{outline:2px solid #38a4ee!important;outline-offset:-3px}
  .wms-book-nav .sheet-tab .wms-book-shape{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(36,59,82,.11))}
  .wms-book-nav .sheet-tab .wms-book-shape path{fill:var(--book-fill);stroke:var(--book-line);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .wms-book-nav .sheet-tab>span:not(.tab-icon){position:relative;z-index:1}
  .wms-book-nav .sheet-subtabs{margin:0!important;padding:5px 10px!important;border:1px solid #dbe5ef;border-top:0;border-radius:0 0 10px 10px;background:#f6f9fc}
  .wms-book-nav .sheet-subtabs[hidden],.wms-book-nav .sheet-children[hidden]{display:none!important}
  .wms-book-nav .sheet-children{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .wms-book-nav .child-tab{border-radius:9px!important}
  .wms-nav-favorites{display:flex;align-items:center;gap:6px;min-height:44px;padding:5px 10px;border:1px solid #dbe5ef;border-radius:0 0 10px 10px;background:#f6f9fc;overflow-x:auto;scrollbar-width:thin}
  .wms-book-nav .sheet-subtabs:not([hidden])+.wms-nav-favorites{border-top:0}
  .wms-nav-favorites>strong{flex:0 0 auto;margin-right:9px;color:#1267ad;font-size:13px}
  .wms-nav-favorites button{flex:0 0 auto;padding:6px 11px;border:0;border-radius:8px;background:transparent;color:#526780;font:inherit;font-size:13px;cursor:pointer}
  .wms-nav-favorites button:hover,.wms-nav-favorites button:focus-visible{background:#e5eef8;color:#1267ad}

  #page-dashboard .wms-home-customize{border:1px solid var(--dash-border);border-radius:10px;background:var(--dash-surface);color:#256596;font-weight:650;cursor:pointer}
  #page-dashboard .wms-dashboard-focus{margin-bottom:18px}
  #page-dashboard .wms-scope-bar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:12px 0 20px}
  #page-dashboard .wms-scope-bar strong{margin-right:4px}
  #page-dashboard .wms-scope-bar button{padding:8px 14px;border:1px solid var(--dash-border);border-radius:10px;background:var(--dash-surface);color:inherit;font:inherit;cursor:pointer}
  #page-dashboard .wms-scope-bar button.active{background:#246da8;border-color:#246da8;color:#fff}
  #page-dashboard .wms-org-card{margin:0 0 18px;padding:17px 19px;border:1px solid var(--dash-border);border-radius:16px;background:var(--dash-surface);box-shadow:var(--dash-shadow)}
  #page-dashboard .wms-org-card h2{margin:0 0 5px;font-size:17px}
  #page-dashboard .wms-org-card>p{margin:0 0 13px;color:var(--dash-muted);font-size:13px}
  #page-dashboard .wms-org-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #page-dashboard .wms-org-unit{padding:13px;border:1px solid var(--dash-border);border-radius:12px;min-width:0}
  #page-dashboard .wms-org-unit[hidden]{display:none}
  #page-dashboard .wms-org-unit h3{margin:0 0 8px;font-size:15px}
  #page-dashboard .wms-org-place{margin:7px 0;line-height:1.55}
  #page-dashboard .wms-org-place b{font-size:13px}
  #page-dashboard .wms-org-place small{display:block;color:var(--dash-muted)}

  #page-dashboard .wms-dashboard-workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
  #page-dashboard .wms-dashboard-column{display:grid;gap:16px;min-width:0}
  #page-dashboard .wms-dashboard-column .card{overflow:hidden;border:1px solid var(--dash-border);border-radius:16px;background:var(--dash-surface);box-shadow:var(--dash-shadow)}
  #page-dashboard .wms-dashboard-column .card-header{padding:17px 19px}
  #page-dashboard .wms-dashboard-column .card-body{padding:16px 19px}
  #page-dashboard .wms-task-list{display:grid}
  #page-dashboard .wms-task-row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:62px;padding:10px 0;border-top:1px solid var(--dash-border)}
  #page-dashboard .wms-task-row:first-child{border-top:0}
  #page-dashboard .wms-task-detail{min-width:0;line-height:1.45;overflow-wrap:anywhere}
  #page-dashboard .wms-task-tag{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:4px 9px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}
  #page-dashboard .wms-task-tag--inspection{background:#fff1de;color:#9c5b12}
  #page-dashboard .wms-task-tag--order{background:#efe6fa;color:#7143a3}
  #page-dashboard .wms-task-tag--stock{background:#fde7e9;color:#af3b4d}
  #page-dashboard .wms-task-tag--asset{background:#e6eff9;color:#386794}
  #page-dashboard .wms-task-row .wms-small-btn{white-space:nowrap}
  #page-dashboard .wms-dashboard-column .status-list{display:grid;gap:15px}
  #page-dashboard .wms-dashboard-column .quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #page-dashboard .wms-dashboard-column .quick-actions button{width:100%}
  #page-dashboard .wms-dashboard-column .alert-item{margin:0}
  #page-dashboard .wms-dashboard-column .alert-list{display:grid;gap:8px}

  html[data-theme="dark"] .wms-book-nav .sheet-tab{--book-fill:#253449;--book-line:#41556e;color:#c3d4e8!important}
  html[data-theme="dark"] .wms-book-nav .sheet-tab:hover{--book-fill:#324963}
  html[data-theme="dark"] .wms-book-nav .sheet-tab.active{--book-fill:#3279b4;--book-line:#3279b4;color:#fff!important}
  html[data-theme="dark"] .wms-book-nav .sheet-subtabs,html[data-theme="dark"] .wms-nav-favorites{background:#202e40;border-color:#35485d}
  html[data-theme="dark"] .wms-nav-favorites>strong{color:#8cc6fb}
  html[data-theme="dark"] .wms-nav-favorites button{color:#c3d4e8}
  html[data-theme="dark"] .wms-nav-favorites button:hover,html[data-theme="dark"] .wms-nav-favorites button:focus-visible{background:#304761;color:#fff}
  html[data-theme="dark"] #page-dashboard .wms-home-customize{color:#a2d4ff}
  html[data-theme="dark"] #page-dashboard .wms-task-tag--inspection{background:#4b3826;color:#f4bf73}
  html[data-theme="dark"] #page-dashboard .wms-task-tag--order{background:#3b3157;color:#d1b8ff}
  html[data-theme="dark"] #page-dashboard .wms-task-tag--stock{background:#512d38;color:#ffabb3}
  html[data-theme="dark"] #page-dashboard .wms-task-tag--asset{background:#263e56;color:#a6cfff}

  .wms-customize-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 15px;margin:8px 0 15px}
  .wms-customize-grid label{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #dbe5ef;border-radius:9px;cursor:pointer}
  .wms-customize-grid input{width:17px;height:17px;accent-color:#1267ad}
  #page-dashboard .wms-favorites-list{display:flex;flex-wrap:wrap;gap:8px}
  #page-dashboard .wms-favorites-list button{padding:9px 12px;border:1px solid var(--dash-border);border-radius:10px;background:var(--dash-surface);color:inherit;font:inherit;cursor:pointer}
  #page-dashboard .wms-favorites-list button:hover{border-color:#3279b4;color:#3279b4}
  #page-dashboard .wms-dashboard-workspace.is-single{grid-template-columns:minmax(0,1fr)}
  .wms-layout-list{display:grid;gap:8px;margin:8px 0 18px}
  .wms-layout-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #dbe5ef;border-radius:10px}
  .wms-layout-row>label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:600}
  .wms-layout-row input{width:17px;height:17px;accent-color:#1267ad}
  .wms-layout-row select,.wms-layout-row button{border:1px solid #cbd9e8;border-radius:8px;background:var(--dash-surface,#fff);color:inherit;padding:6px;cursor:pointer}
  .wms-layout-row button{min-width:34px}
  .wms-layout-row button:disabled{opacity:.4;cursor:default}
  html[data-theme="dark"] .wms-layout-row{border-color:#41556e}

  @media(max-width:1000px){
    #page-dashboard .wms-dashboard-focus{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:900px){
    #page-dashboard .wms-dashboard-workspace{grid-template-columns:1fr}
  }
  @media(max-width:700px){
    #page-dashboard .wms-org-grid{grid-template-columns:1fr}
  }
  @media(max-width:600px){
    .wms-book-nav{padding:6px 8px 0!important}
    .wms-book-nav .sheet-tab{min-width:147px;height:48px!important;font-size:13px!important}
    #page-dashboard .wms-task-row{grid-template-columns:80px minmax(0,1fr)}
    #page-dashboard .wms-task-row .wms-small-btn{grid-column:2;justify-self:start}
    .wms-customize-grid{grid-template-columns:1fr}
  }
  @media(max-width:520px){
    #page-dashboard .wms-dashboard-focus{gap:10px}
    #page-dashboard .wms-dashboard-focus .wms-kpi{min-height:136px;padding:14px}
    #page-dashboard .wms-kpi .stat-value{font-size:30px}
    #page-dashboard .wms-kpi .stat-label{font-size:13px}
    .wms-layout-row{flex-wrap:wrap}
    .wms-layout-row>label{flex-basis:100%}
  }

  /* SaaS Navbar：跟隨現有 data-theme 與底部主題切換 JS */
  .topbar.wms-saas-navbar{
    --nav-glass:rgba(255,255,255,.82);
    --nav-border:rgba(148,163,184,.22);
    --nav-text:#213247;
    --nav-muted:#718197;
    --nav-field:rgba(241,245,249,.86);
    --nav-hover:rgba(226,235,244,.82);
    --nav-accent:#246da8;
    --nav-account:rgba(255,255,255,.9);
    --nav-panel:#fff;
    --nav-shadow:0 8px 30px rgba(30,48,72,.055);
    box-sizing:border-box;
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    width:100%;
    min-height:88px;
    height:auto;
    padding:16px 28px;
    border:0;
    border-bottom:1px solid var(--nav-border);
    border-radius:0;
    background:var(--nav-glass);
    color:var(--nav-text);
    box-shadow:var(--nav-shadow);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    backdrop-filter:blur(20px) saturate(150%);
    transition:background-color .2s ease,border-color .2s ease;
  }

  html[data-theme="dark"] .topbar.wms-saas-navbar{
    --nav-glass:rgba(18,27,40,.84);
    --nav-border:rgba(148,163,184,.16);
    --nav-text:#e8eef7;
    --nav-muted:#9aabc0;
    --nav-field:rgba(34,47,65,.84);
    --nav-hover:rgba(50,69,91,.8);
    --nav-accent:#8fc7f5;
    --nav-account:rgba(34,47,65,.88);
    --nav-panel:#1c293b;
    --nav-shadow:0 8px 30px rgba(0,0,0,.16);
  }

  .wms-saas-navbar .topbar-left{
    display:flex;
    align-items:center;
    flex:0 0 auto;
    min-width:0;
    gap:0;
  }

  .wms-saas-navbar .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0;
  }

  .wms-saas-navbar .brand-mark{
    display:grid;
    place-items:center;
    flex:0 0 44px;
    width:44px;
    height:44px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:13px;
    background:linear-gradient(145deg,#3384bd,#20577e);
    color:#fff;
    box-shadow:0 5px 12px rgba(36,109,168,.18),inset 0 1px 0 rgba(255,255,255,.18);
    font-size:24px;
    font-weight:800;
    line-height:1;
  }

  .wms-saas-navbar .brand-text{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
  }

  .wms-saas-navbar .brand-text strong{
    color:var(--nav-text);
    font-size:19px;
    font-weight:800;
    line-height:1.2;
    letter-spacing:.025em;
    white-space:nowrap;
  }

  .wms-saas-navbar .brand-text>span{
    color:var(--nav-muted);
    font-size:11px;
    font-weight:500;
    line-height:1.3;
    letter-spacing:.035em;
    white-space:nowrap;
  }

  .wms-navbar-search{
    box-sizing:border-box;
    display:flex;
    align-items:center;
    flex:1 1 320px;
    gap:10px;
    width:100%;
    max-width:460px;
    min-width:120px;
    height:44px;
    margin:0 auto;
    padding:0 14px;
    border:1px solid var(--nav-border);
    border-radius:13px;
    background:var(--nav-field);
    color:var(--nav-muted);
    box-shadow:inset 0 1px 2px rgba(15,23,42,.025);
    transition:border-color .18s ease,box-shadow .18s ease;
  }

  .wms-navbar-search:focus-within{
    border-color:var(--nav-accent);
    box-shadow:0 0 0 3px rgba(69,145,201,.14);
  }

  .wms-navbar-search>svg{
    display:block;
    flex:0 0 19px;
    width:19px;
    height:19px;
    pointer-events:none;
  }

  .wms-navbar-search input{
    box-sizing:border-box;
    flex:1;
    width:100%;
    min-width:0;
    height:100%;
    margin:0;
    padding:0;
    border:0;
    border-radius:0;
    outline:none;
    background:transparent;
    color:var(--nav-text);
    box-shadow:none;
    font:inherit;
    font-size:13px;
  }

  .wms-navbar-search input::placeholder{
    color:var(--nav-muted);
    opacity:1;
  }

  .wms-saas-navbar .topbar-right{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    flex:0 0 auto;
    gap:10px;
    margin:0;
  }

  .wms-saas-navbar .icon-btn{
    box-sizing:border-box;
    position:relative;
    display:grid;
    place-items:center;
    flex:0 0 42px;
    width:42px;
    height:42px;
    min-width:42px;
    margin:0;
    padding:0;
    border:1px solid transparent;
    border-radius:12px;
    background:transparent;
    color:var(--nav-muted);
    box-shadow:none;
    font-size:23px;
    line-height:1;
    cursor:pointer;
    transition:background-color .18s ease,color .18s ease;
  }

  .wms-saas-navbar .icon-btn:hover{
    background:var(--nav-hover);
    color:var(--nav-text);
  }

  .wms-saas-navbar .icon-btn svg{
    display:block;
    width:21px;
    height:21px;
  }

  .wms-saas-navbar .notification-dot{
    position:absolute;
    top:8px;
    right:9px;
    width:6px;
    height:6px;
    border:2px solid var(--nav-panel);
    border-radius:50%;
    background:#e66e6e;
    box-shadow:none;
  }

  .wms-saas-navbar .account-area{
    position:relative;
    flex:0 0 auto;
    margin:0 0 0 4px;
  }

  .wms-saas-navbar .account-trigger{
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:48px;
    margin:0;
    padding:5px 12px 5px 6px;
    border:1px solid var(--nav-border);
    border-radius:999px;
    background:var(--nav-account);
    color:var(--nav-text);
    box-shadow:0 3px 10px rgba(15,23,42,.035);
    font:inherit;
    cursor:pointer;
    transition:border-color .18s ease,background-color .18s ease;
  }

  .wms-saas-navbar .account-trigger:hover,
  .wms-saas-navbar .account-trigger[aria-expanded="true"]{
    border-color:var(--nav-accent);
    background:var(--nav-field);
  }

.wms-palette-mode{display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid var(--wms-ui-line);font-size:13px;font-weight:600}.wms-palette-mode>div{display:flex;flex:1;padding:3px;border:1px solid var(--wms-ui-line);border-radius:10px;background:var(--wms-ui-soft)}.wms-palette-mode button{flex:1;min-height:37px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--wms-ui-muted);font:inherit;font-size:13px;cursor:pointer}.wms-palette-mode button[aria-pressed="true"]{background:var(--wms-ui-panel);border-color:var(--wms-ui-line);color:var(--wms-ui-accent);box-shadow:0 1px 4px rgba(0,0,0,.04)}.wms-palette-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.wms-palette-footer small{font-size:11px;line-height:1.6;color:var(--wms-ui-muted)}.wms-palette-apply{flex:0 0 auto;min-height:41px;padding:9px 15px;border:1px solid var(--palette-button);border-radius:10px;background:var(--palette-button);color:#fff;font:inherit;font-size:13px;font-weight:650;cursor:pointer}.wms-palette-apply:hover{background:var(--palette-hover)}
#page-count .wms-count-workspace{padding:22px;border:1px solid var(--wms-ui-line);border-radius:16px;background:var(--wms-ui-panel);box-shadow:var(--wms-ui-shadow)}
.wms-count-path{margin-bottom:17px;font-size:12px;line-height:1.7;color:var(--wms-ui-muted)}
.wms-count-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding:14px 16px;margin-bottom:18px;border:1px solid var(--wms-ui-line);border-radius:12px;background:var(--wms-ui-panel)}
.wms-count-location-label{display:flex;align-items:center;gap:10px;flex:1 1 320px;font-size:13px;font-weight:600;white-space:nowrap}.wms-count-location-label select{width:100%;min-width:0;max-width:420px}
#inlineCountSearch{flex:1 1 180px;min-width:140px}.wms-count-toolbar>small{font-size:11px;line-height:1.6;color:var(--wms-ui-muted);flex:1 1 180px}.wms-count-progress{flex:1 1 130px;max-width:220px;min-width:120px;font-size:12px;color:var(--wms-ui-muted)}.wms-count-progress span{display:block;margin-bottom:8px}.wms-count-progress progress{display:block;appearance:none;width:100%;height:7px;overflow:hidden;border:0;border-radius:9px;background:var(--wms-ui-line);accent-color:var(--palette-button)}.wms-count-progress progress::-webkit-progress-bar{background:var(--wms-ui-line);border-radius:9px}.wms-count-progress progress::-webkit-progress-value{background:var(--palette-button);border-radius:9px}.wms-count-progress progress::-moz-progress-bar{background:var(--palette-button);border-radius:9px}
#page-count .wms-inline-count-table{min-width:0!important;table-layout:fixed;width:100%;font-size:14px}
#page-count .wms-inline-count-table th:first-child{width:40%}#page-count .wms-inline-count-table th:nth-child(2){width:12%}#page-count .wms-inline-count-table th:nth-child(3){width:18%}#page-count .wms-inline-count-table th:last-child{width:30%}
#page-count .wms-inline-count-table td,#page-count .wms-inline-count-table th{padding:14px 18px}#page-count .wms-inline-count-table td:nth-child(2),#page-count .wms-inline-count-table td:nth-child(3){font-weight:500;font-variant-numeric:tabular-nums}#page-count .wms-inline-count-table td strong{display:block;font-size:15px;line-height:1.5;font-weight:650}#page-count .wms-inline-count-table td small{display:block;margin-top:3px;font-size:11px;line-height:1.5;color:var(--wms-ui-muted);font-weight:400}#page-count .wms-inline-count-table td input{width:100%;min-height:45px;padding:10px 12px;background:var(--wms-ui-panel);font-size:17px;font-weight:500}#page-count .wms-inline-count-table tr:focus-within{background:var(--wms-ui-tint)}
#page-count .wms-count-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-top:18px;margin-top:4px}.wms-count-footer>small{max-width:550px;color:var(--wms-ui-muted);font-size:12px;line-height:1.7}.wms-count-footer>div{display:flex;flex-wrap:wrap;gap:10px}.wms-count-footer .btn{min-height:43px!important;padding:9px 18px!important}
.wms-count-message{margin:14px 0 0;min-height:18px;color:var(--wms-ui-accent);font-size:12px;line-height:1.7}
.wms-count-history{margin:16px 0;border:1px solid var(--wms-ui-line);border-radius:13px;background:var(--wms-ui-panel);overflow:hidden}.wms-count-history>summary{padding:16px 18px;color:var(--wms-ui-muted);font-size:13px;font-weight:650;cursor:pointer}.wms-count-history[open]>summary{border-bottom:1px solid var(--wms-ui-line);color:var(--wms-ui-ink)}.wms-count-history>summary:focus-visible{outline:2px solid var(--wms-ui-accent);outline-offset:-3px}
@media(max-width:720px){#page-count .wms-count-workspace{padding:14px}.wms-count-toolbar{padding:12px;gap:12px}.wms-count-location-label{flex-basis:100%;white-space:normal;flex-wrap:wrap}.wms-count-location-label select{max-width:100%;min-width:0}.wms-count-progress{max-width:none;min-width:110px}.wms-count-toolbar>small{flex-basis:100%}#page-count .wms-inline-count-table td,#page-count .wms-inline-count-table th{padding:12px 8px}#page-count .wms-inline-count-table th:first-child{width:34%}#page-count .wms-inline-count-table th:nth-child(2){width:12%}#page-count .wms-inline-count-table th:nth-child(3){width:21%}#page-count .wms-inline-count-table th:last-child{width:33%}#page-count .wms-inline-count-table td strong{font-size:13px}#page-count .wms-inline-count-table td input{font-size:16px;padding:9px 7px}.wms-count-footer>div{width:100%;justify-content:flex-end}.wms-count-history .table-wrap{max-width:100%}}
@media(max-width:420px){#palettePanel{right:12px;padding:17px;border-radius:16px}.wms-palette-grid{gap:6px}.wms-palette-choice{min-height:88px}.wms-palette-swatch{width:42px;height:42px}.wms-palette-footer{gap:8px}.wms-palette-footer small{max-width:135px}#page-count .wms-count-workspace{padding:10px}#page-count .wms-inline-count-table th{font-size:11px}#page-count .wms-inline-count-table td{font-size:12px;padding:11px 6px}.wms-count-message,.wms-count-footer>small{font-size:11px}}

<body>

<div class="app">

  <main class="main">

    <header class="topbar wms-saas-navbar" aria-label="頂部工具列">

      <div class="topbar-left">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">B</div>
          <div class="brand-text">
            <strong>BOMB WMS</strong>
            <span>Warehouse Management</span>
          </div>
        </div>
      </div>

      <!-- 搜尋框外觀；跨頁搜尋邏輯尚未加入底部 JS -->
      <div class="wms-navbar-search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <path d="m16 16 4.5 4.5"/>
        </svg>
        <input
          id="navbarSearch"
          type="search"
          placeholder="搜尋品項、庫存或位置…"
          aria-label="搜尋品項、庫存或位置（功能建置中）"
          title="跨頁搜尋功能建置中"
          autocomplete="off"
          disabled
        >
      </div>

      <div class="topbar-right">
        <div class="wms-palette-area">
          <button class="icon-btn" id="paletteBtn" type="button" aria-label="介面配色" title="介面配色" aria-expanded="false" aria-controls="palettePanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1.7-3c-.6-1 .1-2.5 1.3-2.5h1.3A3.7 3.7 0 0 0 21 11.8 9 9 0 0 0 12 3Z"/><circle cx="7.5" cy="10" r=".8"/><circle cx="10" cy="6.8" r=".8"/><circle cx="14.4" cy="6.8" r=".8"/><circle cx="17" cy="10" r=".8"/></svg></button>
          <section id="palettePanel" role="dialog" aria-labelledby="paletteTitle" hidden></section>
        </div>

        <button
          class="icon-btn"
          id="themeBtn"
          type="button"
          aria-label="切換淺色深色"
          title="切換淺色／深色"
        >☾</button>

        <button
          class="icon-btn"
          type="button"
          data-action="go-notifications"
          aria-label="通知中心"
          title="通知中心"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>
          <span class="notification-dot" id="notificationBadge" aria-hidden="true"></span>
        </button>

        <div class="account-area">
          <button
            type="button"
            class="account-trigger"
            id="accountBtn"
            aria-expanded="false"
            aria-controls="accountPanel"
            aria-label="OG 帳號資訊"
          >
            <span class="wms-account-avatar" aria-hidden="true">OG</span>
            <span class="wms-account-info">
              <strong>OG</strong>
              <span class="account-role">最高權限</span>
            </span>
            <svg class="wms-account-chevron" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>

          <div class="account-panel" id="accountPanel" hidden>
            <strong>OG</strong>
            <span>最高權限 · 展示帳號</span>
            <p>登入／登出功能尚未建立</p>
          </div>
        </div>

      </div>

    </header>

   <!-- WMS 工作區書籤 -->
<nav class="sheet-nav wms-book-nav" aria-label="BOMB WMS 工作區">

  <div class="sheet-tabs" aria-label="主要功能">

    <button type="button" class="sheet-tab active" data-page="dashboard" aria-selected="true">
      <span>營運總覽</span>
    </button>

    <button type="button" class="sheet-tab" data-group="inventoryOps" aria-selected="false">
      <span>庫存作業</span>
    </button>

    <button type="button" class="sheet-tab" data-group="procurement" aria-selected="false">
      <span>採購管理</span>
    </button>

    <button type="button" class="sheet-tab" data-group="assets" aria-selected="false">
      <span>資產設備</span>
    </button>

    <button type="button" class="sheet-tab" data-group="stocktake" aria-selected="false">
      <span>盤點管理</span>
    </button>

    <button type="button" class="sheet-tab" data-group="organization" aria-selected="false">
      <span>組織與位置</span>
    </button>

    <button type="button" class="sheet-tab" data-group="workCenter" aria-selected="false">
      <span>工作中心</span>
    </button>

    <button type="button" class="sheet-tab" data-group="masterData" aria-selected="false">
      <span>基礎資料</span>
    </button>

    <button type="button" class="sheet-tab" data-group="system" aria-selected="false">
      <span>系統管理</span>
    </button>

  </div>

  <div class="sheet-subtabs" hidden>

    <!-- 庫存作業 -->
    <div class="sheet-children" data-children="inventoryOps" aria-label="庫存作業子選單" hidden>

      <button type="button" class="child-tab" data-page="inventory" data-parent="inventoryOps" aria-selected="false">
        <span class="tab-icon" data-icon="inventory" aria-hidden="true"></span>
        <span>庫存總覽</span>
      </button>

      <button type="button" class="child-tab" data-page="inbound" data-parent="inventoryOps" aria-selected="false">
        <span class="tab-icon" data-icon="inbound" aria-hidden="true"></span>
        <span>收貨</span>
      </button>

      <button type="button" class="child-tab" data-page="inspection" data-parent="inventoryOps" aria-selected="false">
        <span class="tab-icon" data-icon="inbound" aria-hidden="true"></span>
        <span>待驗／驗收</span>
      </button>

      <button type="button" class="child-tab" data-page="putaway" data-parent="inventoryOps" aria-selected="false">
        <span>入庫上架</span>
      </button>

      <button type="button" class="child-tab" data-page="requisition" data-parent="inventoryOps" aria-selected="false">
        <span>領用／補貨</span>
      </button>

      <button type="button" class="child-tab" data-page="transfer" data-parent="inventoryOps" aria-selected="false">
        <span class="tab-icon" data-icon="transfer" aria-hidden="true"></span>
        <span>調撥／位置移轉</span>
      </button>

      <button type="button" class="child-tab" data-page="borrow" data-parent="inventoryOps" aria-selected="false">
        <span class="tab-icon" data-icon="borrow" aria-hidden="true"></span>
        <span>借用／歸還</span>
      </button>

    </div>

    <!-- 採購管理 -->
    <div class="sheet-children" data-children="procurement" aria-label="採購管理子選單" hidden>

      <button type="button" class="child-tab" data-page="purchase" data-parent="procurement" aria-selected="false">
        <span class="tab-icon" data-icon="purchase" aria-hidden="true"></span>
        <span>採購需求</span>
      </button>

      <button type="button" class="child-tab" data-page="hqreceiving" data-parent="procurement" aria-selected="false">
        <span>到貨追蹤</span>
      </button>

    </div>

    <!-- 資產設備 -->
    <div class="sheet-children" data-children="assets" aria-label="資產設備子選單" hidden>

      <button type="button" class="child-tab" data-page="assets" data-parent="assets" aria-selected="false">
        <span class="tab-icon" data-icon="assets" aria-hidden="true"></span>
        <span>資產管理</span>
      </button>

      <button type="button" class="child-tab" data-page="machine" data-parent="assets" aria-selected="false">
        <span class="tab-icon" data-icon="machine" aria-hidden="true"></span>
        <span>設備配置</span>
      </button>

      <button type="button" class="child-tab" data-page="repair" data-parent="assets" aria-selected="false">
        <span class="tab-icon" data-icon="repair" aria-hidden="true"></span>
        <span>維修／保養</span>
      </button>

      <button type="button" class="child-tab" data-page="lifecycle" data-parent="assets" aria-selected="false">
        <span>退貨／報廢</span>
      </button>

    </div>

    <!-- 盤點管理 -->
    <div class="sheet-children" data-children="stocktake" aria-label="盤點管理子選單" hidden>

      <button type="button" class="child-tab" data-page="count" data-parent="stocktake" aria-selected="false">
        <span class="tab-icon" data-icon="count" aria-hidden="true"></span>
        <span>盤點作業</span>
      </button>

    </div>

    <!-- 組織與位置 -->
    <div class="sheet-children" data-children="organization" aria-label="組織與位置子選單" hidden>

      <button type="button" class="child-tab" data-page="racks" data-parent="organization" aria-selected="false">
        <span class="tab-icon" data-icon="racks" aria-hidden="true"></span>
        <span>據點／區域／位置</span>
      </button>

    </div>

    <!-- 工作中心 -->
    <div class="sheet-children" data-children="workCenter" aria-label="工作中心子選單" hidden>

      <button type="button" class="child-tab" data-page="notifications" data-parent="workCenter" aria-selected="false">
        <span class="tab-icon" data-icon="notifications" aria-hidden="true"></span>
        <span>我的待辦／通知</span>
      </button>

      <button type="button" class="child-tab" data-page="log" data-parent="workCenter" aria-selected="false">
        <span class="tab-icon" data-icon="log" aria-hidden="true"></span>
        <span>異動紀錄</span>
      </button>

      <button type="button" class="child-tab" data-page="reports" data-parent="workCenter" aria-selected="false">
        <span class="tab-icon" data-icon="dashboard" aria-hidden="true"></span>

<dialog id="wmsDialog" class="wms-dialog" aria-label="WMS 操作視窗"></dialog>
<script>
(function(){
  const html=document.documentElement;
  const themeBtn=document.getElementById('themeBtn');
  const storedTheme=localStorage.getItem('bomb-wms-theme');
  if(storedTheme==='dark'||storedTheme==='light')html.dataset.theme=storedTheme;
  function themeIcon(){themeBtn.textContent=html.dataset.theme==='dark'?'☀':'☾'}
  themeIcon();
  themeBtn.addEventListener('click',()=>{html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';localStorage.setItem('bomb-wms-theme',html.dataset.theme);themeIcon()});

  /* Personal appearance preferences: independent from WMS stock data. */
  const PALETTE_KEY='bomb-wms-palette-v1';
  const paletteChoices=[

    if(!p||!['待叫貨','已核准','已叫貨'].includes(p.status))return;
    const next=requirePositive(value);

  }

  function downloadExcelTemplate(){
    const raw=atob(WMS_TEMPLATE_BASE64),bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const link=document.createElement('a');link.href=url;link.download='BOMB_WMS_批次匯入範本.xlsx';link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  // Read the four data sheets from the BOMB WMS template without an external script.
  async function readWmsWorkbook(file){
    if(file.size>20*1024*1024)throw Error('Excel 檔案超過 20 MB');
    const bytes=new Uint8Array(await file.arrayBuffer()),view=new DataView(bytes.buffer);
    const u16=p=>view.getUint16(p,true),u32=p=>view.getUint32(p,true);
    let end=-1;
    for(let p=bytes.length-22;p>=Math.max(0,bytes.length-65557);p--)if(u32(p)===0x06054b50){end=p;break}
    if(end<0)throw Error('不是有效的 XLSX 檔案');
    const decoder=new TextDecoder(),files=new Map();
    let ptr=u32(end+16);
    for(let i=0;i<u16(end+10);i++){
      if(u32(ptr)!==0x02014b50)throw Error('Excel 壓縮結構不完整');
      const method=u16(ptr+10),size=u32(ptr+20),unpacked=u32(ptr+24),nameLen=u16(ptr+28),extra=u16(ptr+30),comment=u16(ptr+32),offset=u32(ptr+42);
      const name=decoder.decode(bytes.slice(ptr+46,ptr+46+nameLen));
      files.set(name,{method,size,unpacked,offset});ptr+=46+nameLen+extra+comment;
    }
    async function readXml(path){
      const entry=files.get(path);if(!entry)throw Error('Excel 缺少工作表檔案：'+path);
      if(entry.unpacked>40*1024*1024)throw Error('工作表資料過大');
      const start=entry.offset;
      if(u32(start)!==0x04034b50)throw Error('Excel 資料區損壞');
      const pos=start+30+u16(start+26)+u16(start+28);
      let data=bytes.slice(pos,pos+entry.size);
      if(data.length!==entry.size)throw Error('Excel 檔案不完整');
      if(entry.method===8)data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      else if(entry.method!==0)throw Error('Excel 使用未支援的壓縮格式');
      const xml=new DOMParser().parseFromString(decoder.decode(data),'application/xml');
      if(xml.getElementsByTagName('parsererror').length)throw Error('Excel 工作表 XML 無法讀取');
      return xml;
    }
    const nodes=(xml,name)=>[...xml.getElementsByTagNameNS('*',name)];
    const workbook=await readXml('xl/workbook.xml'),rels=await readXml('xl/_rels/workbook.xml.rels');
    const relation=new Map(nodes(rels,'Relationship').map(n=>[n.getAttribute('Id'),n.getAttribute('Target')]));
    const sheetFiles=new Map(nodes(workbook,'sheet').map(n=>{
      const id=n.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||n.getAttribute('r:id');
      const path=relation.get(id)||'';
      return [n.getAttribute('name'),path.startsWith('/')?path.slice(1):path.startsWith('xl/')?path:'xl/'+path];
    }));
    let strings=[];
    if(files.has('xl/sharedStrings.xml')){
      const xml=await readXml('xl/sharedStrings.xml');
      strings=nodes(xml,'si').map(si=>nodes(si,'t').map(t=>t.textContent).join(''));
    }
    async function sheet(name,headers){
      const path=sheetFiles.get(name);if(!path)throw Error('缺少「'+name+'」工作表');
      const xml=await readXml(path),rows=[];
      for(const row of nodes(xml,'row')){
        const cells=[];
        for(const c of nodes(row,'c')){
          const address=c.getAttribute('r')||'',letters=address.match(/^[A-Z]+/)?.[0];
          if(!letters)continue;
          let col=0;for(const ch of letters)col=col*26+ch.charCodeAt(0)-64;
          const type=c.getAttribute('t'),v=nodes(c,'v')[0]?.textContent||'';
          cells[col-1]=type==='s'?strings[Number(v)]||'':type==='inlineStr'?nodes(c,'t').map(t=>t.textContent).join(''):v;
        }
        if(cells.some(v=>String(v??'').trim()))rows.push({line:Number(row.getAttribute('r')),cells});
      }
      const head=rows.shift();
      if(!head||headers.some((h,i)=>String(head.cells[i]??'').trim()!==h))throw Error('「'+name+'」欄位與範本不同，請使用下載的新版範本');
      if(rows.length>10000)throw Error('「'+name+'」超過 10000 筆');
      return rows.map(({line,cells})=>({line,cells:cells.map(v=>String(v??'').trim())}));
    }
    const itemRows=await sheet('品項主檔',['品項編號＊','品項名稱＊','類型＊','分類＊','單位＊','安全庫存＊','啟用狀態＊','圖片網址（選填）']);
    const locationRows=await sheet('位置主檔',['位置編號＊','管理單位＊','地點＊','區域＊','實際位置／架位／層位＊']);
    const stockRows=await sheet('消耗品期初',['品項編號＊','位置編號＊','期初數量＊']);
    const assetRows=await sheet('設備資產',['資產編號＊','品項編號＊','位置編號＊','設備狀態＊','保管人（選填）']);
    const fail=(tab,line,message)=>{throw Error(`${tab}第 ${line} 列：${message}`)};
    const required=(value,tab,line,label)=>{if(!value)fail(tab,line,label+'不可空白');return value};
    const whole=(value,tab,line,label)=>{if(!/^(0|[1-9]\d*)$/.test(value)||!Number.isSafeInteger(Number(value)))fail(tab,line,label+'須為非負整數');return Number(value)};
    const unique=(id,set,tab,line)=>{if(set.has(id))fail(tab,line,'編號重複：'+id);set.add(id)};
    const itemIds=new Set(),locationIds=new Set(),assetIds=new Set(),stockKeys=new Set();
    const items=itemRows.map(({line,cells:c})=>{
      const tab='品項主檔',id=required(c[0],tab,line,'品項編號');unique(id,itemIds,tab,line);
      if(!['消耗品','設備'].includes(c[2]))fail(tab,line,'類型只能是消耗品或設備');
      if(!['啟用','停用'].includes(c[6]))fail(tab,line,'啟用狀態只能是啟用或停用');
      return {id,name:required(c[1],tab,line,'品項名稱'),type:c[2],category:required(c[3],tab,line,'分類'),unit:required(c[4],tab,line,'單位'),safety:whole(c[5],tab,line,'安全庫存'),enabled:c[6]==='啟用',imageUrl:c[7]||''};
    });
    const itemMap=new Map(items.map(x=>[x.id,x]));
    const locations=locationRows.map(({line,cells:c})=>{
      const tab='位置主檔',id=required(c[0],tab,line,'位置編號');unique(id,locationIds,tab,line);
      if(!ORG_TREE[c[1]]?.[c[2]]?.includes(c[3]))fail(tab,line,'管理單位／地點／區域的組合不正確');
      return {id,department:c[1],site:c[2],area:c[3],spot:required(c[4],tab,line,'實際位置')};
    });
    const stock=stockRows.map(({line,cells:c})=>{
      const tab='消耗品期初',x=itemMap.get(c[0]);
      if(!x||x.type!=='消耗品')fail(tab,line,'品項編號須對應消耗品');
      if(!locationIds.has(c[1]))fail(tab,line,'位置編號不存在');
      const key=c[0]+'\u0000'+c[1];unique(key,stockKeys,tab,line);
      return {itemId:c[0],locationId:c[1],qty:whole(c[2],tab,line,'期初數量')};
    });
    const statuses=['可用','使用中','借用中','故障','待檢測','維修中','待報廢'];
    const assets=assetRows.map(({line,cells:c})=>{
      const tab='設備資產',id=required(c[0],tab,line,'資產編號');unique(id,assetIds,tab,line);
      if(itemMap.get(c[1])?.type!=='設備')fail(tab,line,'品項編號須對應設備');
      if(!locationIds.has(c[2]))fail(tab,line,'位置編號不存在');
      if(!statuses.includes(c[3]))fail(tab,line,'設備狀態不在允許清單');
      return {id,itemId:c[1],locationId:c[2],status:c[3],holder:c[4]||''};
    });
    if(!items.length||!locations.length)throw Error('品項主檔與位置主檔至少各填一筆');
    return {version:2,items,locations,stock,assets,inbound:[],transfers:[],borrows:[],repairs:[],counts:[],purchases:[],logs:[]};
  }
  function importExcel(){
    if(typeof DecompressionStream==='undefined'){alert('此瀏覽器不支援讀取 XLSX，請改用最新版 Chrome 或 Edge');return}
    const input=document.createElement('input');input.type='file';input.accept='.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    input.addEventListener('change',async()=>{
      const file=input.files?.[0];if(!file)return;
      try{
        const next=await readWmsWorkbook(file);
        const summary=`品項 ${next.items.length} 筆、位置 ${next.locations.length} 筆、消耗品期初 ${next.stock.length} 筆、設備 ${next.assets.length} 台`;
        if(!confirm(`檢查通過：${summary}\n\n確定以 Excel 資料替換目前瀏覽器的 WMS 展示資料？原資料會先下載 JSON 備份，並留一份在此瀏覽器。`))return;
        localStorage.setItem('bomb-wms-preimport-backup-v1',JSON.stringify(db));
        next.logs.push({id:'LG-0001',time:stamp(),action:'Excel批次匯入',subject:summary,from:'原資料已備份',to:'新展示資料',who:'OG',ref:''});
        localStorage.setItem(KEY,JSON.stringify(next));
        exportData();db=next;inventorySnapshot=null;normalizeLocations();save();
        alert('匯入完成：'+summary);
      }catch(error){alert('Excel 匯入失敗：'+(error.message||error))}
    });
    input.click();
  }
  function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const value=JSON.parse(await file.text());if(value.version!==2||!['items','locations','assets','stock','inbound','transfers','borrows','repairs','counts','purchases','logs'].every(k=>Array.isArray(value[k])))throw Error('備份檔格式不符');if(!confirm('匯入會覆蓋目前瀏覽器的 WMS 展示資料，確定繼續？'))return;db=value;inventorySnapshot=null;normalizeLocations();save()}catch(e){alert('匯入失敗：'+e.message)}});input.click()}
  /* BOMB WMS integration schema v1: additive migration, no fabricated stock. */
  let inventorySnapshot=null;
  function prepareIntegration(){
    for(const key of ['rules','requisitions','workflows','inventoryEvents'])if(!Array.isArray(db[key]))db[key]=[];
    db.integrationVersion=1;
    if(!db.organization)db.organization=structuredClone(DEFAULT_ORG_TREE);
    ORG_TREE=db.organization;
    // Include existing imported locations in the editable organization definition.
    db.locations.forEach(l=>{const unit=l.department,site=l.site||'未分類';if(!ORG_TREE[unit])ORG_TREE[unit]={};if(!ORG_TREE[unit][site])ORG_TREE[unit][site]=[];if(!ORG_TREE[unit][site].includes(l.area))ORG_TREE[unit][site].push(l.area)});
    if(!db.connections)db.connections={erp:'',hr:'',companyCode:'',note:''};
    if(!['全部',...Object.keys(ORG_TREE)].includes(homeScope))homeScope='全部';
    prepareHQ();
    if(!inventorySnapshot)inventorySnapshot=inventoryState();
  }
  function inventoryState(){
    const result={};

  function countDraft(locationId){try{const draft=JSON.parse(localStorage.getItem('bomb-wms-count-draft-v1:'+locationId)||'{}');return draft&&typeof draft==='object'&&!Array.isArray(draft)?draft:{}}catch(e){return {}}}
  function renderCountWorkspace(scopedRules){
    const places=db.locations.filter(matchUnit),valid=places.some(l=>l.id===countWorkspace.locationId);if(!valid)countWorkspace.locationId=places.find(l=>countList(l.id).length&&/備品|倉架|庫存/.test(l.area+' '+l.spot))?.id||places.find(l=>countList(l.id).length)?.id||places[0]?.id||'';
    const locationId=countWorkspace.locationId,list=countList(locationId),draft=countDraft(locationId);countWorkspace.ids=list.map(x=>x.id);countWorkspace.before=Object.fromEntries(list.map(x=>[x.id,amountAt(x.id,locationId)]));
    const filled=list.filter(x=>draft[x.id]!==undefined&&draft[x.id]!=='').length,percent=list.length?Math.round(filled/list.length*100):0;
    const rows=list.map(x=>`<tr data-count-item="${E(x.id)}" data-count-search="${E(x.id+' '+x.name)}"><td><strong>${E(x.name)}</strong><small>${E(x.id)}</small></td><td>${E(x.unit)}</td><td>${countWorkspace.before[x.id]}</td><td><input name="${E(x.id)}" type="number" min="0" step="1" inputmode="numeric" autocomplete="off" placeholder="未盤" value="${E(draft[x.id]??'')}" aria-label="${E(x.name)}實盤量（${E(x.unit)}）"></td></tr>`).join('');
    const counts=db.counts.filter(r=>matchUnit(loc(r.locationId))),pending=counts.filter(r=>r.status==='待確認').length;
    const history=table('rows-count',['單號','時間','位置','品項','帳面','實盤','差異','狀態','操作'],formatRows(counts,[r=>cell(r.id),r=>cell(r.time),r=>cell(labelLoc(r.locationId)),r=>cell(itemName(r.itemId)),r=>cell(r.before),r=>cell(r.actual),r=>cell(r.diff),r=>`<td>${badge(r.status||'已確認（舊紀錄）')}</td>`,r=>`<td>${r.status==='待確認'?button('confirm-count','確認差異',r.id)+' '+button('cancel-count','取消',r.id):E(r.reason||r.cancelReason||'－')}</td>`]));
    document.getElementById('page-count').innerHTML=header('耗材盤點','選好位置，逐項輸入現場數量即可。',button('count-history','查看紀錄'+(pending?'・'+pending+' 待確認':'')))+`<section class="wms-count-workspace"><div class="wms-count-path">${E(labelLoc(locationId))}</div><div class="wms-count-toolbar"><label class="wms-count-location-label">盤點位置<select id="inlineCountLocation" aria-label="盤點位置">${optionsHtml(choices(places,l=>labelLoc(l.id)),locationId)}</select></label><input id="inlineCountSearch" type="search" placeholder="搜尋品項" aria-label="搜尋盤點品項"><div class="wms-count-progress"><span id="inlineCountProgress" aria-live="polite">已填 ${filled} / ${list.length} 項</span><progress id="inlineCountMeter" value="${filled}" max="${list.length||1}" aria-label="盤點填寫進度">${percent}%</progress></div><small>未填表示這次不盤；送出後確認差異。</small></div><form id="inlineCountForm"><div class="table-wrap"><table class="wms-inline-count-table"><thead><tr><th>品項</th><th>單位</th><th>帳面數量</th><th>實盤數量</th></tr></thead><tbody id="inlineCountRows">${rows||'<tr><td colspan="4" class="wms-empty">此位置尚無耗材清單，請選其他位置，或設定品項與補貨規則。</td></tr>'}<tr id="inlineCountNoMatch" hidden><td colspan="4" class="wms-empty">找不到符合的品項</td></tr></tbody></table></div><p id="inlineCountMessage" role="status" class="wms-count-message">${E(countWorkspace.message||(filled?'已恢復暫存草稿，請核對現場數量。':''))}</p><div class="wms-count-footer"><small>確認差異後才調整庫存；補貨依各部門設定處理。</small><div>${button('count-save-draft','暫存草稿')}<button type="submit" class="btn btn-primary" ${list.length?'':'disabled'}>送出盤點</button></div></div></form></section><details id="countHistory" class="wms-count-history" ${countWorkspace.historyOpen?'open':''}><summary>盤點紀錄與待確認差異${pending?'・'+pending+' 件':''}</summary>${history}</details>`+`<details class="wms-count-history"><summary>盤點與補貨安排</summary>${table('count-schedules',['部門','品項','安排','補貨門檻','每次補貨','方式'],formatRows(scopedRules,[r=>cell(r.department),r=>cell(itemName(r.itemId)),r=>cell(scheduleLabel(r)),r=>cell(r.threshold+' '+item(r.itemId)?.unit),r=>cell(r.fixedQty+' '+r.packUnit+'＝'+r.fixedQty*r.packSize+' '+item(r.itemId)?.unit),r=>cell(r.route)]))}</details>`;
  }
  function countValues(){const f=document.getElementById('inlineCountForm');return f?Object.fromEntries(new FormData(f)):{}}
  function saveCountDraft(notify=false){if(!countWorkspace.locationId)return;const values=countValues();localStorage.setItem('bomb-wms-count-draft-v1:'+countWorkspace.locationId,JSON.stringify(values));const filled=countWorkspace.ids.filter(id=>values[id]!==undefined&&values[id]!=='').length;document.getElementById('inlineCountProgress').textContent=`已填 ${filled} / ${countWorkspace.ids.length} 項`;document.getElementById('inlineCountMeter').value=filled;if(notify){countWorkspace.message='草稿已暫存於這台瀏覽器。';document.getElementById('inlineCountMessage').textContent=countWorkspace.message}}
  function writeCountEntries(locationId,ids,before,values,note){
    if(!loc(locationId))throw Error('盤點位置不存在');const entries=ids.filter(id=>values[id]!==''&&values[id]!==undefined).map(id=>({x:item(id),actual:requireNonnegative(values[id])}));if(!entries.length)throw Error('至少填寫一項實盤數');
    if(entries.some(({x})=>!x?.enabled||x.type!=='消耗品'||!allowedItem(x,loc(locationId)?.department)))throw Error('品項設定已變更，請重新開啟盤點');
    if(entries.some(({x})=>amountAt(x.id,locationId)!==before[x.id]))throw Error('盤點期間帳面已有異動，請重新開啟並核對');
    if(entries.some(({x})=>db.counts.some(r=>r.locationId===locationId&&r.itemId===x.id&&r.status==='待確認')))throw Error('已有待確認盤點，請先在查看紀錄處理差異');
    entries.forEach(({x,actual})=>{const id=code('CT',db.counts);db.counts.unshift({id,time:stamp(),itemId:x.id,locationId,before:before[x.id],actual,diff:actual-before[x.id],who:'OG',note,status:'待確認'});log('送出盤點',x.name,`${before[x.id]} ${x.unit}`,`實盤 ${actual}；待確認`,id)});localStorage.removeItem('bomb-wms-count-draft-v1:'+locationId);return entries.length;
  }
  function submitInlineCount(values){const n=writeCountEntries(countWorkspace.locationId,countWorkspace.ids,countWorkspace.before,values,'現場耗材盤點');countWorkspace.message=`已送出 ${n} 項，請在紀錄中確認差異；庫存尚未調整。`;countWorkspace.historyOpen=true;save()}
  function cancelCount(id){const r=db.counts.find(q=>q.id===id);if(!r||r.status!=='待確認')return;form('取消待確認盤點 '+id,[field('reason','取消原因（帳面已異動時可取消後重盤）')],v=>{if(r.status!=='待確認')throw Error('盤點狀態已變更');r.status='已取消';r.cancelReason=v.reason;r.cancelledAt=stamp();log('取消盤點',itemName(r.itemId),'待確認','已取消；'+v.reason,id)})}
  function countStock(){showPage('count');document.getElementById('inlineCountLocation')?.focus()}
  function toggleCountHistory(){const history=document.getElementById('countHistory');if(!history)return;history.open=!history.open;countWorkspace.historyOpen=history.open;if(history.open)history.scrollIntoView({behavior:'smooth',block:'start'})}
  document.addEventListener('input',e=>{if(e.target.closest('#inlineCountForm')&&e.target.matches('input[type="number"]'))saveCountDraft();if(e.target.id==='inlineCountSearch'){const q=e.target.value.trim().toLocaleLowerCase();let visible=0;document.querySelectorAll('#inlineCountRows [data-count-item]').forEach(tr=>{tr.hidden=!tr.dataset.countSearch.toLocaleLowerCase().includes(q);if(!tr.hidden)visible++});document.getElementById('inlineCountNoMatch').hidden=!!visible||!countWorkspace.ids.length}});
  document.addEventListener('change',e=>{if(e.target.id==='inlineCountLocation'){saveCountDraft();countWorkspace.locationId=e.target.value;countWorkspace.message='';renderAll()}});
  document.addEventListener('submit',e=>{if(e.target.id!=='inlineCountForm')return;e.preventDefault();try{submitInlineCount(Object.fromEntries(new FormData(e.target)))}catch(error){document.getElementById('inlineCountMessage').textContent=error.message||'盤點無法送出'}});

  const handlers={'reset-home-positions':resetHomePositions,'new-item':addItem,'new-inbound':inbound,'new-transfer-asset':transferAsset,'new-transfer-stock':transferStock,'new-borrow':borrow,'new-repair':repair,'new-replacement':replaceAsset,'new-count':countStock,'new-purchase':purchase,'new-location':addLocation,'refresh':renderAll,'go-log':()=>showPage('log'),'go-notifications':()=>showPage('notifications'),'go-inspection':()=>showPage('inspection'),'go-purchase':()=>showPage('purchase'),'go-inventory':()=>showPage('inventory'),'go-assets':()=>showPage('assets'),'customize-home':customizeHome,'go-racks':()=>showPage('racks'),'set-home-scope':id=>{if(['全部',...Object.keys(ORG_TREE)].includes(id)){homeScope=id;localStorage.setItem(HOME_SCOPE_KEY,id);renderAll()}},'export':exportData,'import':importData,'import-excel':importExcel,'download-excel-template':downloadExcelTemplate,'close-dialog':()=>dialog.close()};
  document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;if(handlers[action])handlers[action](id);else if(action==='edit-item')editItem(id);else if(action==='return-asset')returnAsset(id);else if(action==='finish-repair')finishRepair(id);else if(action==='approve-purchase')approve(id);else if(action==='inspect-inbound')inspectInbound(id);else if(action==='toggle-order')setOrderDecision(id,'ordered',target.checked);else if(action==='toggle-no-order')setOrderDecision(id,'no-order',target.checked)});
  Object.assign(handlers,integrationHandlers,hqHandlers,{'count-save-draft':()=>saveCountDraft(true),'count-history':toggleCountHistory,'cancel-count':cancelCount});
  renderAll();
})();
</script>
