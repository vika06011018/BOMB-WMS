<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">

<title>BOMB WMS｜倉儲與資產管理系統</title>
<link rel="stylesheet" href="assets/wms.css">
<style>
  #page-dashboard{--dash-surface:#fff;--dash-border:#e2e8f0;--dash-muted:#64748b;--dash-shadow:0 10px 28px rgba(25,42,75,.05)}
  html[data-theme="dark"] #page-dashboard{--dash-surface:#171e29;--dash-border:#2d394b;--dash-muted:#9bb0cc;--dash-shadow:0 12px 30px rgba(0,0,0,.11)}
  #page-dashboard .wms-dashboard-section-title{margin:24px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  #page-dashboard .wms-dashboard-section-title h2{margin:0;font-size:18px;font-weight:750;letter-spacing:.02em}
  #page-dashboard .wms-dashboard-section-title p{margin:0;color:var(--dash-muted);font-size:13px}
  #page-dashboard .wms-dashboard-focus{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0 0 26px}
  #page-dashboard .wms-dashboard-focus .wms-kpi{--kpi-accent:#6275dc;--kpi-tint:rgba(98,117,220,.13);position:relative;isolation:isolate;min-width:0;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;padding:19px 20px;border:1px solid var(--dash-border);border-radius:18px;background:linear-gradient(145deg,var(--kpi-tint),transparent 62%),var(--dash-surface);box-shadow:var(--dash-shadow);transition:transform .18s ease,box-shadow .18s ease}
  #page-dashboard .wms-dashboard-focus .wms-kpi:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(25,42,75,.12)}
  #page-dashboard .wms-kpi--stocked{--kpi-accent:#1eaa78;--kpi-tint:rgba(30,170,120,.12)}
  #page-dashboard .wms-kpi--inspection{--kpi-accent:#d8962d;--kpi-tint:rgba(216,150,45,.14)}
  #page-dashboard .wms-kpi--order{--kpi-accent:#9970d8;--kpi-tint:rgba(153,112,216,.14)}
  #page-dashboard .wms-kpi .stat-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #page-dashboard .wms-kpi .stat-label{font-size:14px;font-weight:650}
  #page-dashboard .wms-kpi .stat-icon{display:grid;place-items:center;width:48px;height:48px;flex:0 0 48px;border:1px solid color-mix(in srgb,var(--kpi-accent) 18%,transparent);border-radius:14px;background:var(--kpi-tint);color:var(--kpi-accent)}
  #page-dashboard .wms-kpi .stat-icon svg{display:block;width:26px;height:26px}
  #page-dashboard .wms-kpi .stat-value{margin-top:8px;font-size:36px;line-height:1.1;font-weight:760;letter-spacing:-.035em}
  #page-dashboard .wms-kpi .stat-note{margin-top:7px;color:var(--dash-muted);font-size:12px;line-height:1.45}
  #page-dashboard .dashboard-grid>div{display:flex;flex-direction:column;gap:16px;min-width:0}
  #page-dashboard .dashboard-grid>div>br{display:none}
  #page-dashboard .dashboard-grid .card{overflow:hidden;border:1px solid var(--dash-border);border-radius:18px;background:var(--dash-surface);box-shadow:var(--dash-shadow)}
  #page-dashboard .dashboard-grid .card-header{padding:17px 19px}
  #page-dashboard .dashboard-grid .card-body{padding:18px 19px}
  #page-dashboard .dashboard-grid .wms-card-footer{border-top:1px solid var(--dash-border)}
  #page-dashboard .dashboard-grid .alert-list{display:grid;gap:9px}
  #page-dashboard .dashboard-grid .alert-item{margin:0;border-radius:12px}
  #page-dashboard .dashboard-grid .alert-icon{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px}
  #page-dashboard .dashboard-grid .alert-icon svg{display:block;width:19px;height:19px}
  @media(max-width:1000px){#page-dashboard .wms-dashboard-focus{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:520px){#page-dashboard .wms-dashboard-focus{gap:10px}#page-dashboard .wms-dashboard-focus .wms-kpi{min-height:136px;padding:14px}#page-dashboard .wms-kpi .stat-value{font-size:30px}#page-dashboard .wms-kpi .stat-label{font-size:13px}}
  @media(prefers-reduced-motion:reduce){#page-dashboard .wms-dashboard-focus .wms-kpi{transition:none}}

  /* 圓角重疊書籤與首頁工作區 */
  .wms-book-nav{display:block!important;padding:10px 16px 0!important;background:transparent!important;border:0!important}
  .wms-book-nav .sheet-tabs{display:flex!important;align-items:flex-end!important;min-height:66px;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:thin;padding:11px 4px 0!important;gap:0!important}
  .wms-book-nav .sheet-tab{--book-fill:#f8fafc;--book-line:#cad5e2;position:relative!important;isolation:isolate;display:flex!important;align-items:center;justify-content:center;flex:0 0 auto!important;min-width:163px;height:53px!important;margin:0 -19px 0 0!important;padding:0 32px 0 17px!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:#4b5f75!important;font-size:14px!important;font-weight:650!important;white-space:nowrap;transform:none;transition:transform .16s ease,color .16s ease}
  .wms-book-nav .sheet-tab:nth-child(1){z-index:7}.wms-book-nav .sheet-tab:nth-child(2){z-index:6}.wms-book-nav .sheet-tab:nth-child(3){z-index:5}.wms-book-nav .sheet-tab:nth-child(4){z-index:4}.wms-book-nav .sheet-tab:nth-child(5){z-index:3}.wms-book-nav .sheet-tab:nth-child(6){z-index:2}.wms-book-nav .sheet-tab:nth-child(7){z-index:1}
  .wms-book-nav .sheet-tab:hover{--book-fill:#eaf3fc;transform:translateY(-2px)}
  .wms-book-nav .sheet-tab::before,.wms-book-nav .sheet-tab::after{content:none!important;display:none!important}
  .wms-book-nav .sheet-tab.active{--book-fill:#246da8;--book-line:#246da8;z-index:20!important;color:#fff!important;transform:translateY(-7px)}
  .wms-book-nav .sheet-tab:focus-visible{outline:2px solid #38a4ee!important;outline-offset:-3px}
  .wms-book-nav .sheet-tab .wms-book-shape{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(36,59,82,.11))}
  .wms-book-nav .sheet-tab .wms-book-shape path{fill:var(--book-fill);stroke:var(--book-line);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .wms-book-nav .sheet-tab>span:not(.tab-icon){position:relative;z-index:1}
  .wms-book-nav .sheet-subtabs{margin:0!important;padding:5px 10px!important;border:1px solid #dbe5ef;border-top:0;border-radius:0 0 10px 10px;background:#f6f9fc}
  .wms-book-nav .sheet-subtabs[hidden],.wms-book-nav .sheet-children[hidden]{display:none!important}
  .wms-book-nav .sheet-children{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .wms-book-nav .child-tab{border-radius:9px!important}
  .wms-nav-favorites{display:flex;align-items:center;gap:6px;min-height:44px;padding:5px 10px;border:1px solid #dbe5ef;border-radius:0 0 10px 10px;background:#f6f9fc;overflow-x:auto;scrollbar-width:thin}
  .wms-book-nav .sheet-subtabs:not([hidden])+.wms-nav-favorites{border-top:0}
  .wms-nav-favorites>strong{flex:0 0 auto;margin-right:9px;color:#1267ad;font-size:13px}
  .wms-nav-favorites button{flex:0 0 auto;padding:6px 11px;border:0;border-radius:8px;background:transparent;color:#526780;font:inherit;font-size:13px;cursor:pointer}
  .wms-nav-favorites button:hover,.wms-nav-favorites button:focus-visible{background:#e5eef8;color:#1267ad}
  #page-dashboard .wms-home-customize{border:1px solid var(--dash-border);border-radius:10px;background:var(--dash-surface);color:#256596;font-weight:650;cursor:pointer}
  #page-dashboard .wms-dashboard-focus{margin-bottom:18px}
  #page-dashboard .wms-dashboard-workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
  #page-dashboard .wms-dashboard-column{display:grid;gap:16px;min-width:0}
  #page-dashboard .wms-dashboard-column .card{overflow:hidden;border:1px solid var(--dash-border);border-radius:16px;background:var(--dash-surface);box-shadow:var(--dash-shadow)}
  #page-dashboard .wms-dashboard-column .card-header{padding:17px 19px}
  #page-dashboard .wms-dashboard-column .card-body{padding:16px 19px}
  #page-dashboard .wms-task-list{display:grid}
  #page-dashboard .wms-task-row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:62px;padding:10px 0;border-top:1px solid var(--dash-border)}
  #page-dashboard .wms-task-row:first-child{border-top:0}
  #page-dashboard .wms-task-detail{min-width:0;line-height:1.45;overflow-wrap:anywhere}
  #page-dashboard .wms-task-tag{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:4px 9px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}
  #page-dashboard .wms-task-tag--inspection{background:#fff1de;color:#9c5b12}
  #page-dashboard .wms-task-tag--order{background:#efe6fa;color:#7143a3}
  #page-dashboard .wms-task-tag--stock{background:#fde7e9;color:#af3b4d}
  #page-dashboard .wms-task-tag--asset{background:#e6eff9;color:#386794}
  #page-dashboard .wms-task-row .wms-small-btn{white-space:nowrap}
  #page-dashboard .wms-dashboard-column .status-list{display:grid;gap:15px}
  #page-dashboard .wms-dashboard-column .quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #page-dashboard .wms-dashboard-column .quick-actions button{width:100%}
  #page-dashboard .wms-dashboard-column .alert-item{margin:0}
  #page-dashboard .wms-dashboard-column .alert-list{display:grid;gap:8px}
  html[data-theme="dark"] .wms-book-nav .sheet-tab{--book-fill:#253449;--book-line:#41556e;color:#c3d4e8!important}
  html[data-theme="dark"] .wms-book-nav .sheet-tab:hover{--book-fill:#324963}
  html[data-theme="dark"] .wms-book-nav .sheet-tab.active{--book-fill:#3279b4;--book-line:#3279b4;color:#fff!important}
  html[data-theme="dark"] .wms-book-nav .sheet-subtabs,html[data-theme="dark"] .wms-nav-favorites{background:#202e40;border-color:#35485d}
  html[data-theme="dark"] .wms-nav-favorites>strong{color:#8cc6fb}
  html[data-theme="dark"] .wms-nav-favorites button{color:#c3d4e8}
  html[data-theme="dark"] .wms-nav-favorites button:hover,html[data-theme="dark"] .wms-nav-favorites button:focus-visible{background:#304761;color:#fff}
  html[data-theme="dark"] #page-dashboard .wms-home-customize{color:#a2d4ff}
  html[data-theme="dark"] #page-dashboard .wms-task-tag--inspection{background:#4b3826;color:#f4bf73}
  html[data-theme="dark"] #page-dashboard .wms-task-tag--order{background:#3b3157;color:#d1b8ff}
  html[data-theme="dark"] #page-dashboard .wms-task-tag--stock{background:#512d38;color:#ffabb3}
  html[data-theme="dark"] #page-dashboard .wms-task-tag--asset{background:#263e56;color:#a6cfff}
  .wms-customize-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 15px;margin:8px 0 15px}
  .wms-customize-grid label{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #dbe5ef;border-radius:9px;cursor:pointer}
  .wms-customize-grid input{width:17px;height:17px;accent-color:#1267ad}
  #page-dashboard .wms-favorites-list{display:flex;flex-wrap:wrap;gap:8px}
  #page-dashboard .wms-favorites-list button{padding:9px 12px;border:1px solid var(--dash-border);border-radius:10px;background:var(--dash-surface);color:inherit;font:inherit;cursor:pointer}
  #page-dashboard .wms-favorites-list button:hover{border-color:#3279b4;color:#3279b4}
  #page-dashboard .wms-dashboard-workspace.is-single{grid-template-columns:minmax(0,1fr)}
  .wms-layout-list{display:grid;gap:8px;margin:8px 0 18px}
  .wms-layout-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #dbe5ef;border-radius:10px}
  .wms-layout-row>label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:600}
  .wms-layout-row input{width:17px;height:17px;accent-color:#1267ad}
  .wms-layout-row select,.wms-layout-row button{border:1px solid #cbd9e8;border-radius:8px;background:var(--dash-surface,#fff);color:inherit;padding:6px;cursor:pointer}
  .wms-layout-row button{min-width:34px}
  .wms-layout-row button:disabled{opacity:.4;cursor:default}
  html[data-theme="dark"] .wms-layout-row{border-color:#41556e}
  @media(max-width:520px){.wms-layout-row{flex-wrap:wrap}.wms-layout-row>label{flex-basis:100%}}
  @media(max-width:900px){#page-dashboard .wms-dashboard-workspace{grid-template-columns:1fr}}
  @media(max-width:600px){.wms-book-nav{padding:6px 8px 0!important}.wms-book-nav .sheet-tab{min-width:147px;height:48px!important;font-size:13px!important}#page-dashboard .wms-task-row{grid-template-columns:80px minmax(0,1fr)}#page-dashboard .wms-task-row .wms-small-btn{grid-column:2;justify-self:start}.wms-customize-grid{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){.wms-book-nav .sheet-tab{transition:none}}
</style>
</head>

<body>

<div class="app">

  <!-- Main -->
  <main class="main">

    <!-- Topbar -->
    <header class="topbar">

      <div class="topbar-left">
        <div class="brand">
          <div class="brand-mark">B</div>
          <div class="brand-text"><strong>BOMB WMS</strong><span>Warehouse Management</span></div>
        </div>
      </div>

      <div class="topbar-right">

        <button
          class="icon-btn"
          id="themeBtn"
          aria-label="切換淺色深色"
          title="切換淺色／深色"
        >
          ☾
        </button>

        <button
          class="icon-btn"
          type="button" data-action="go-notifications" aria-label="通知"
          title="通知中心"
        >
          🔔
          <span class="notification-dot" id="notificationBadge"></span>
        </button>

        <div class="account-area">
          <button type="button" class="account-trigger" id="accountBtn" aria-expanded="false" aria-controls="accountPanel">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span>OG</span><span class="account-role">最高權限</span>
          </button>
          <div class="account-panel" id="accountPanel" hidden>
            <strong>OG</strong>
            <span>最高權限 · 展示帳號</span>
            <p>登入／登出功能尚未建立</p>
          </div>
        </div>

      </div>

    </header>

    <!-- WMS 工作區書籤 -->
    <nav class="sheet-nav wms-book-nav" aria-label="WMS 工作區">
      <div class="sheet-tabs" aria-label="主要標籤">
        <button type="button" class="sheet-tab active" data-page="dashboard" aria-selected="true"><span>營運總覽</span></button>
        <button type="button" class="sheet-tab" data-group="catalog" aria-selected="false"><span>品項與庫存</span></button>
        <button type="button" class="sheet-tab" data-group="procurement" aria-selected="false"><span>採購與驗收</span></button>
        <button type="button" class="sheet-tab" data-group="assets" aria-selected="false"><span>資產與設備</span></button>
        <button type="button" class="sheet-tab" data-group="operations" aria-selected="false"><span>異動與盤點</span></button>
        <button type="button" class="sheet-tab" data-group="reports" aria-selected="false"><span>報表與紀錄</span></button>
        <button type="button" class="sheet-tab" data-group="system" aria-selected="false"><span>系統設定</span></button>
      </div>
      <div class="sheet-subtabs" hidden>
        <div class="sheet-children" data-children="catalog" aria-label="品項與庫存子標籤" hidden>
          <button type="button" class="child-tab" data-page="items" data-parent="catalog" aria-selected="false"><span class="tab-icon" data-icon="items" aria-hidden="true"></span><span>品項管理</span></button>
          <button type="button" class="child-tab" data-page="inventory" data-parent="catalog" aria-selected="false"><span class="tab-icon" data-icon="inventory" aria-hidden="true"></span><span>庫存管理</span></button>
          <button type="button" class="child-tab" data-page="racks" data-parent="catalog" aria-selected="false"><span class="tab-icon" data-icon="racks" aria-hidden="true"></span><span>位置／倉架</span></button>
        </div>
        <div class="sheet-children" data-children="procurement" aria-label="採購與驗收子標籤" hidden>
          <button type="button" class="child-tab" data-page="purchase" data-parent="procurement" aria-selected="false"><span class="tab-icon" data-icon="purchase" aria-hidden="true"></span><span>採購需求</span></button>
          <button type="button" class="child-tab" data-page="inbound" data-parent="procurement" aria-selected="false"><span class="tab-icon" data-icon="inbound" aria-hidden="true"></span><span>到貨登記</span></button>
          <button type="button" class="child-tab" data-page="inspection" data-parent="procurement" aria-selected="false"><span class="tab-icon" data-icon="inbound" aria-hidden="true"></span><span>驗收</span></button>
        </div>
        <div class="sheet-children" data-children="assets" aria-label="資產與設備子標籤" hidden>
          <button type="button" class="child-tab" data-page="assets" data-parent="assets" aria-selected="false"><span class="tab-icon" data-icon="assets" aria-hidden="true"></span><span>資產管理</span></button>
          <button type="button" class="child-tab" data-page="machine" data-parent="assets" aria-selected="false"><span class="tab-icon" data-icon="machine" aria-hidden="true"></span><span>機台管理</span></button>
          <button type="button" class="child-tab" data-page="repair" data-parent="assets" aria-selected="false"><span class="tab-icon" data-icon="repair" aria-hidden="true"></span><span>維修更換</span></button>
        </div>
        <div class="sheet-children" data-children="operations" aria-label="異動與盤點子標籤" hidden>
          <button type="button" class="child-tab" data-page="transfer" data-parent="operations" aria-selected="false"><span class="tab-icon" data-icon="transfer" aria-hidden="true"></span><span>調撥／配置</span></button>
          <button type="button" class="child-tab" data-page="borrow" data-parent="operations" aria-selected="false"><span class="tab-icon" data-icon="borrow" aria-hidden="true"></span><span>借用／歸還</span></button>
          <button type="button" class="child-tab" data-page="count" data-parent="operations" aria-selected="false"><span class="tab-icon" data-icon="count" aria-hidden="true"></span><span>盤點管理</span></button>
        </div>
        <div class="sheet-children" data-children="reports" aria-label="報表與紀錄子標籤" hidden>
          <button type="button" class="child-tab" data-page="reports" data-parent="reports" aria-selected="false"><span class="tab-icon" data-icon="dashboard" aria-hidden="true"></span><span>摘要報表</span></button>
          <button type="button" class="child-tab" data-page="log" data-parent="reports" aria-selected="false"><span class="tab-icon" data-icon="log" aria-hidden="true"></span><span>異動日誌</span></button>
          <button type="button" class="child-tab" data-page="notifications" data-parent="reports" aria-selected="false"><span class="tab-icon" data-icon="notifications" aria-hidden="true"></span><span>通知中心</span></button>
        </div>
        <div class="sheet-children" data-children="system" aria-label="系統設定子標籤" hidden>
          <button type="button" class="child-tab" data-page="roles" data-parent="system" aria-selected="false"><span class="tab-icon" data-icon="roles" aria-hidden="true"></span><span>角色與權限</span></button>
          <button type="button" class="child-tab" data-page="import" data-parent="system" aria-selected="false"><span class="tab-icon" data-icon="import" aria-hidden="true"></span><span>匯入／匯出</span></button>
          <button type="button" class="child-tab" data-page="settings" data-parent="system" aria-selected="false"><span class="tab-icon" data-icon="settings" aria-hidden="true"></span><span>系統設定</span></button>
        </div>
      </div>
    </nav>

    <!-- Content -->
    <div class="content">
      <div class="page-view active" id="page-dashboard"></div>
      <div class="page-view" id="page-items"></div>
      <div class="page-view" id="page-inventory"></div>
      <div class="page-view" id="page-assets"></div>
      <div class="page-view" id="page-inbound"></div>
      <div class="page-view" id="page-inspection"></div>
      <div class="page-view" id="page-transfer"></div>
      <div class="page-view" id="page-borrow"></div>
      <div class="page-view" id="page-repair"></div>
      <div class="page-view" id="page-machine"></div>
      <div class="page-view" id="page-racks"></div>
      <div class="page-view" id="page-count"></div>
      <div class="page-view" id="page-purchase"></div>
      <div class="page-view" id="page-notifications"></div>
      <div class="page-view" id="page-log"></div>
      <div class="page-view" id="page-reports"></div>
      <div class="page-view" id="page-roles"></div>
      <div class="page-view" id="page-import"></div>
      <div class="page-view" id="page-settings"></div>
    </div>
  </main>
</div>
<dialog id="wmsDialog" class="wms-dialog" aria-label="WMS 操作視窗"></dialog>
<script>
(function(){
  const html=document.documentElement;
  const themeBtn=document.getElementById('themeBtn');
  const storedTheme=localStorage.getItem('bomb-wms-theme');
  if(storedTheme==='dark'||storedTheme==='light')html.dataset.theme=storedTheme;
  function themeIcon(){themeBtn.textContent=html.dataset.theme==='dark'?'☀':'☾'}
  themeIcon();

      <td data-label="操作">${r.status==='待審核'?button('approve-purchase','核准',r.id):'－'}</td>
    </tr>`).join(''):'';
    page('purchase','採購需求','低庫存自動列入；調整數量後選已叫貨或無須叫貨',['品項','叫貨數量','已叫貨','無須叫貨','狀態','來源／部門','原因','操作'],purchaseRows,actions(['new-purchase','＋ 新增需求']),'勾選只儲存在目前裝置的瀏覽器；到貨後請先登記，再到驗收頁面確認');
    const notes=[...warnings().map(x=>({type:'庫存預警',text:`${x.name} 可用 ${available(x.id)} ${x.unit}，低於安全庫存 ${x.safety} ${x.unit}`,ref:x.id})),...db.purchases.filter(p=>['待審核','待叫貨'].includes(p.status)).map(p=>({type:p.status==='待叫貨'?'待叫貨':'待審核採購',text:`${p.department} 申請 ${itemName(p.itemId)} × ${p.qty}`,ref:p.id})),...db.assets.filter(a=>['故障','待檢測','維修中'].includes(a.status)).map(a=>({type:'設備狀態',text:`${a.id} ${itemName(a.itemId)}：${a.status}`,ref:a.id}))];
    page('notifications','通知中心','依最新庫存、採購及設備狀態即時計算提醒',['類型','通知內容','關聯編號','狀態'],formatRows(notes,[n=>cell(n.type),n=>cell(n.text),n=>cell(n.ref),n=>`<td>${badge('待處理')}</td>`]));
    page('log','異動日誌','記錄本機展示資料的操作人、前後狀態與關聯單號',['時間','動作','品項／資產','異動前','異動後','操作人','關聯單號'],formatRows(db.logs,[r=>cell(r.time),r=>cell(r.action),r=>cell(r.subject),r=>cell(r.from),r=>cell(r.to),r=>cell(r.who),r=>cell(r.ref||'－')]));

    page('import','匯入／匯出','以 JSON 備份或還原目前瀏覽器的展示資料',['項目','用途','資料格式'],row(['匯出資料','保存品項、位置、資產、庫存及異動紀錄','JSON'].map(cell))+row(['匯入資料','還原相同格式的備份檔','JSON'].map(cell)),actions(['export','下載備份'],['import','匯入備份']));
    const departments=['總部','辦公室部門'];
    page('settings','系統設定','目前展示資料使用此分類與規則',['設定','目前內容','用途'],row(['部門',departments.join('、'),'物品、資產與位置的歸屬'].map(cell))+row(['辦公室部門區域','機台區、辦公區、備品區','管理實際位置'].map(cell))+row(['安全庫存','依品項設定；全公司可用數低於門檻即提醒','通知中心與採購需求'].map(cell))+row(['資料保存','目前瀏覽器 localStorage','重新開啟仍保留；可匯出備份'].map(cell)));
    const total=db.assets.length,ready=db.assets.filter(a=>a.status==='可用').length,using=db.assets.filter(a=>['使用中','借用中'].includes(a.status)).length,repairing=db.assets.filter(a=>['故障','待檢測','維修中'].includes(a.status)).length;
    const today=stamp().split(' ')[0];
    const todayArrivals=db.inbound.filter(r=>String(r.time||'').split(' ')[0]===today).length;
    const todayStocked=db.inbound.filter(r=>Number(r.accepted)>0&&String(r.inspectedAt||'').split(' ')[0]===today).length;
    const awaitingInspection=db.inbound.filter(r=>r.status==='待驗收').length;
    const pendingOrders=db.purchases.filter(p=>p.status==='待叫貨').length;
    const reportData=[['品項總數',db.items.filter(x=>x.enabled).length,'目前啟用品項'],['消耗品在庫數',db.stock.reduce((sum,x)=>sum+Number(x.qty||0),0),'各位置數量合計'],['設備資產數',total,'包含使用中及維修中的設備'],['可用設備數',ready,'可供配置的設備'],['待驗收單數',awaitingInspection,'尚未計入庫存'],['待叫貨需求數',pendingOrders,'採購需求待處理'],['低庫存品項數',warnings().length,'低於安全庫存']];
    page('reports','摘要報表','依目前瀏覽器資料即時計算作業摘要',['項目','數量','計算說明'],reportData.map(([name,value,note])=>row([cell(name),cell(value),cell(note)])).join(''),actions(['refresh','重新整理']),'目前瀏覽器的展示資料；後續可與 ERP 報表介接');
    const dashboardIcon=paths=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${paths}</svg>`;
    const dashboardIcons={
      arrival:dashboardIcon('<path d="M3 15v5h18v-5"/><path d="M12 3v11m0 0-4-4m4 4 4-4"/>'),
      stocked:dashboardIcon('<path d="M4 8.5 12 4l8 4.5v9L12 22l-8-4.5z"/><path d="m4 8.5 8 4.5 8-4.5M12 13v9"/><path d="m8.5 17 1.5 1.5 3-3"/>'),
      inspection:dashboardIcon('<rect x="5" y="5" width="14" height="17" rx="2"/><path d="M9 5V3h6v2M9 10h6M9 14h3"/><circle cx="16" cy="17" r="3"/><path d="M16 15.5V17l1 1"/>'),
      order:dashboardIcon('<path d="M4 4h2l2 11h11l2-8H7"/><path d="M9 11h8M10 18h.01M18 18h.01"/><circle cx="10" cy="19" r="1"/><circle cx="18" cy="19" r="1"/>')
    };
    const stats=[['今日到貨登記',todayArrivals,'今天建立的到貨單','arrival'],['今日驗收入庫',todayStocked,'驗收合格並計入庫存','stocked'],['待驗收',awaitingInspection,'到貨後尚未完成驗收','inspection'],['待叫貨',pendingOrders,'等待採購人員叫貨','order']].map(([name,value,note,kind])=>`<article class="stat-card wms-kpi wms-kpi--${kind}"><div class="stat-head"><span class="stat-label">${E(name)}</span><span class="stat-icon" aria-hidden="true">${dashboardIcons[kind]}</span></div><div class="stat-value">${value}</div><div class="stat-note">${E(note)}</div></article>`).join('');
    const tasks=[
      ...db.inbound.filter(r=>r.status==='待驗收').map(r=>({kind:'inspection',label:'待驗收',detail:`${itemName(r.itemId)} × ${r.qty}`,action:'go-inspection',button:'前往驗收'})),
      ...db.purchases.filter(p=>p.status==='待叫貨').map(p=>({kind:'order',label:'待叫貨',detail:`${itemName(p.itemId)} × ${p.qty}`,action:'go-purchase',button:'前往採購'})),
      ...warnings().map(x=>({kind:'stock',label:'庫存提醒',detail:`${x.name} 可用 ${available(x.id)} ${x.unit}，低於安全庫存`,action:'go-inventory',button:'查看庫存'})),
      ...db.assets.filter(a=>['故障','待檢測','維修中'].includes(a.status)).map(a=>({kind:'asset',label:'設備狀態',detail:`${a.id} ${itemName(a.itemId)}：${a.status}`,action:'go-assets',button:'查看資產'}))
    ];
    const taskBody=tasks.length?tasks.slice(0,5).map(t=>`<div class="wms-task-row"><span class="wms-task-tag wms-task-tag--${E(t.kind)}">${E(t.label)}</span><span class="wms-task-detail">${E(t.detail)}</span>${button(t.action,t.button)}</div>`).join(''):'<p class="wms-empty">目前沒有待辦事項</p>';
    const warningIcon=dashboardIcon('<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5m0 3h.01"/>');
    const alerts=notes.slice(0,5).map(n=>`<div class="alert-item"><div class="alert-icon" aria-hidden="true">${warningIcon}</div><div class="alert-content"><div class="alert-title">${E(n.type)}</div><div class="alert-desc">${E(n.text)}</div></div></div>`).join('')||'<p class="wms-empty">目前沒有待處理提醒</p>';
    const recent=formatRows(db.logs.slice(0,5),[r=>cell(r.time),r=>cell(r.action),r=>cell(r.subject),r=>cell(r.from),r=>cell(r.to),r=>cell(r.who)]);
    const widgets={
      tasks:card('今日待辦','驗收、叫貨與庫存提醒',`<div class="card-body wms-task-list">${taskBody}</div>`),
      favorites:card('我的常用','自行挑選常用功能',`<div class="card-body wms-favorites-list">${renderFavorites()}</div>`),
      equipment:card('設備概況',`設備總數 ${total} 台・可用 ${ready} 台`,`<div class="card-body"><div class="status-list">${[['可用',ready,'success'],['使用中／借用中',using,''],['故障／待檢測／維修中',repairing,'warning']].map(([n,v,c])=>`<div class="status-row"><div class="status-name">${n}</div><div class="progress"><div class="progress-bar ${c}" style="width:${total?Math.round(v/total*100):0}%"></div></div><div class="status-number">${v}</div></div>`).join('')}</div></div>`),
      quick:card('快速操作','常用 WMS 作業',`<div class="card-body quick-actions">${[['new-inbound','到貨登記'],['new-purchase','新增需求'],['new-count','開始盤點'],['new-transfer-asset','調撥設備']].map(([a,t])=>button(a,t)).join('')}</div>`),
      alerts:card('異常與提醒','低庫存、採購與設備狀態',`<div class="card-body"><div class="alert-list">${alerts}</div></div>`),
      recent:card('最近異動','最新五筆操作紀錄',table('dashboard-log',['時間','異動類型','品項／資產','原位置','新位置','操作人'],recent)+`<div class="wms-card-footer" style="display:flex;justify-content:flex-end;padding:12px 16px">${button('go-log','查看全部異動')}</div>`)
    };
    const left=dashboardPrefs.widgets.filter(key=>dashboardPrefs.columns[key]==='left'&&widgets[key]).map(key=>widgets[key]).join('');
    const right=dashboardPrefs.widgets.filter(key=>dashboardPrefs.columns[key]!=='left'&&widgets[key]).map(key=>widgets[key]).join('');
    document.getElementById('page-dashboard').innerHTML=header('營運總覽','今天需要處理的倉儲作業與設備狀態',`<button type="button" class="btn wms-small-btn wms-home-customize" data-action="customize-home">自訂首頁</button> ${button('refresh','重新整理')}`)+`<div class="wms-dashboard-section-title"><h2>今日作業</h2><p>資料儲存在目前瀏覽器</p></div><section class="stats-grid wms-dashboard-focus">${stats}</section><section class="wms-dashboard-workspace ${left&&right?'':'is-single'}">${left?`<div class="wms-dashboard-column">${left}</div>`:''}${right?`<div class="wms-dashboard-column">${right}</div>`:''}</section>`;
    const bell=document.getElementById('notificationBadge');if(bell)bell.hidden=!notes.length;
    filterItems();
  }
  function filterItems(){const search=document.getElementById('itemSearch'),type=document.getElementById('itemTypeFilter'),status=document.getElementById('itemStatusFilter');if(!search)return;const q=search.value.trim().toLowerCase();document.querySelectorAll('#rows-items tr').forEach(tr=>{const t=tr.querySelectorAll('td');if(!t.length)return;tr.hidden=!((t[0].textContent.toLowerCase().includes(q)||t[1].textContent.toLowerCase().includes(q))&&(!type.value||t[2].textContent===type.value)&&(!status.value||t[6].textContent===status.value))})}
  document.addEventListener('input',e=>{if(e.target.id==='itemSearch')filterItems()});
  document.addEventListener('change',e=>{if(['itemTypeFilter','itemStatusFilter'].includes(e.target.id))filterItems();if(e.target.dataset.action==='order-qty'){try{updateOrderQty(e.target.dataset.id,e.target.value)}catch(error){alert(error.message);renderAll()}}});
  function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BOMB-WMS-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const value=JSON.parse(await file.text());if(value.version!==2||!['items','locations','assets','stock','inbound','transfers','borrows','repairs','counts','purchases','logs'].every(k=>Array.isArray(value[k])))throw Error('備份檔格式不符');if(!confirm('匯入會覆蓋目前瀏覽器的 WMS 展示資料，確定繼續？'))return;db=value;save()}catch(e){alert('匯入失敗：'+e.message)}});input.click()}
  const handlers={'new-item':addItem,'new-inbound':inbound,'new-transfer-asset':transferAsset,'new-transfer-stock':transferStock,'new-borrow':borrow,'new-repair':repair,'new-replacement':replaceAsset,'new-count':countStock,'new-purchase':purchase,'new-location':addLocation,'refresh':renderAll,'go-log':()=>showPage('log'),'go-notifications':()=>showPage('notifications'),'go-inspection':()=>showPage('inspection'),'go-purchase':()=>showPage('purchase'),'go-inventory':()=>showPage('inventory'),'go-assets':()=>showPage('assets'),'customize-home':customizeHome,'export':exportData,'import':importData,'close-dialog':()=>dialog.close()};
  document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;if(handlers[action])handlers[action]();else if(action==='edit-item')editItem(id);else if(action==='return-asset')returnAsset(id);else if(action==='finish-repair')finishRepair(id);else if(action==='approve-purchase')approve(id);else if(action==='inspect-inbound')inspectInbound(id);else if(action==='toggle-order')setOrderDecision(id,'ordered',target.checked);else if(action==='toggle-no-order')setOrderDecision(id,'no-order',target.checked)});
  renderAll();
})();
