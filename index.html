<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">

<title>BOMB WMS｜倉儲與資產管理系統</title>
<link rel="stylesheet" href="assets/wms.css">
</head>

<body>

<div class="app">

  <!-- Main -->
  <main class="main">

    <!-- Topbar -->
    <header class="topbar">

      <div class="topbar-left">
        <div class="brand">
          <div class="brand-mark">B</div>
          <div class="brand-text"><strong>BOMB WMS</strong><span>Warehouse Management</span></div>
        </div>
      </div>

      <div class="topbar-right">

        <button
          class="icon-btn"
          id="themeBtn"
          aria-label="切換淺色深色"
          title="切換淺色／深色"
        >
          ☾
        </button>

        <button
          class="icon-btn"
          type="button" data-action="go-notifications" aria-label="通知"
          title="通知中心"
        >
          🔔
          <span class="notification-dot" id="notificationBadge"></span>
        </button>

        <div class="account-area">
          <button type="button" class="account-trigger" id="accountBtn" aria-expanded="false" aria-controls="accountPanel">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span>OG</span><span class="account-role">最高權限</span>
          </button>
          <div class="account-panel" id="accountPanel" hidden>
            <strong>OG</strong>
            <span>最高權限 · 展示帳號</span>
            <p>登入／登出功能尚未建立</p>
          </div>
        </div>

      </div>

    </header>

    <!-- Excel-style worksheet tabs -->
    <nav class="sheet-nav" aria-label="WMS 工作表">
      <div class="sheet-tabs" aria-label="主要標籤">
        <button type="button" class="sheet-tab active" data-page="dashboard" aria-selected="true"><span class="tab-icon" data-icon="dashboard" aria-hidden="true"></span><span>營運總覽</span></button>
        <button type="button" class="sheet-tab" data-group="operations" aria-selected="false"><span class="tab-icon" data-icon="count" aria-hidden="true"></span><span>管理作業</span></button>
        <button type="button" class="sheet-tab" data-page="items" aria-selected="false"><span class="tab-icon" data-icon="items" aria-hidden="true"></span><span>品項管理</span></button>
        <button type="button" class="sheet-tab" data-page="inventory" aria-selected="false"><span class="tab-icon" data-icon="inventory" aria-hidden="true"></span><span>庫存管理</span></button>
        <button type="button" class="sheet-tab" data-page="assets" aria-selected="false"><span class="tab-icon" data-icon="assets" aria-hidden="true"></span><span>資產管理</span></button>
        <button type="button" class="sheet-tab" data-page="inbound" aria-selected="false"><span class="tab-icon" data-icon="inbound" aria-hidden="true"></span><span>入庫</span></button>
        <button type="button" class="sheet-tab" data-page="inspection" aria-selected="false"><span class="tab-icon" data-icon="inbound" aria-hidden="true"></span><span>驗收</span></button>
        <button type="button" class="sheet-tab" data-group="movement" aria-selected="false"><span class="tab-icon" data-icon="transfer" aria-hidden="true"></span><span>異動管理</span></button>
        <button type="button" class="sheet-tab" data-group="locations" aria-selected="false"><span class="tab-icon" data-icon="machine" aria-hidden="true"></span><span>機台與位置</span></button>
        <button type="button" class="sheet-tab" data-group="system" aria-selected="false"><span class="tab-icon" data-icon="roles" aria-hidden="true"></span><span>系統管理</span></button>
      </div>
      <div class="sheet-subtabs" hidden>
      <div class="sheet-children" data-children="movement" aria-label="異動管理子標籤" hidden>
        <button type="button" class="child-tab" data-page="transfer" data-parent="movement" aria-selected="false"><span class="tab-icon" data-icon="transfer" aria-hidden="true"></span><span>調撥／配置</span></button>
        <button type="button" class="child-tab" data-page="borrow" data-parent="movement" aria-selected="false"><span class="tab-icon" data-icon="borrow" aria-hidden="true"></span><span>借用／歸還</span></button>
        <button type="button" class="child-tab" data-page="repair" data-parent="movement" aria-selected="false"><span class="tab-icon" data-icon="repair" aria-hidden="true"></span><span>維修更換</span></button>
      </div>
      <div class="sheet-children" data-children="locations" aria-label="機台與位置子標籤" hidden>
        <button type="button" class="child-tab" data-page="machine" data-parent="locations" aria-selected="false"><span class="tab-icon" data-icon="machine" aria-hidden="true"></span><span>機台管理</span></button>
        <button type="button" class="child-tab" data-page="racks" data-parent="locations" aria-selected="false"><span class="tab-icon" data-icon="racks" aria-hidden="true"></span><span>位置／倉架</span></button>
      </div>
      <div class="sheet-children" data-children="operations" aria-label="管理作業子標籤" hidden>
        <button type="button" class="child-tab" data-page="count" data-parent="operations" aria-selected="false"><span class="tab-icon" data-icon="count" aria-hidden="true"></span><span>盤點管理</span></button>
        <button type="button" class="child-tab" data-page="purchase" data-parent="operations" aria-selected="false"><span class="tab-icon" data-icon="purchase" aria-hidden="true"></span><span>採購需求</span></button>
        <button type="button" class="child-tab" data-page="notifications" data-parent="operations" aria-selected="false"><span class="tab-icon" data-icon="notifications" aria-hidden="true"></span><span>通知中心</span></button>
        <button type="button" class="child-tab" data-page="log" data-parent="operations" aria-selected="false"><span class="tab-icon" data-icon="log" aria-hidden="true"></span><span>異動日誌</span></button>
      </div>
      <div class="sheet-children" data-children="system" aria-label="系統管理子標籤" hidden>
        <button type="button" class="child-tab" data-page="roles" data-parent="system" aria-selected="false"><span class="tab-icon" data-icon="roles" aria-hidden="true"></span><span>角色與權限</span></button>
        <button type="button" class="child-tab" data-page="import" data-parent="system" aria-selected="false"><span class="tab-icon" data-icon="import" aria-hidden="true"></span><span>匯入／匯出</span></button>
        <button type="button" class="child-tab" data-page="settings" data-parent="system" aria-selected="false"><span class="tab-icon" data-icon="settings" aria-hidden="true"></span><span>系統設定</span></button>
      </div>
      </div>
    </nav>

    <!-- Content -->
    <div class="content">
      <div class="page-view active" id="page-dashboard"></div>
      <div class="page-view" id="page-items"></div>
      <div class="page-view" id="page-inventory"></div>
      <div class="page-view" id="page-assets"></div>
      <div class="page-view" id="page-inbound"></div>
      <div class="page-view" id="page-inspection"></div>
      <div class="page-view" id="page-transfer"></div>
      <div class="page-view" id="page-borrow"></div>
      <div class="page-view" id="page-repair"></div>
      <div class="page-view" id="page-machine"></div>
      <div class="page-view" id="page-racks"></div>
      <div class="page-view" id="page-count"></div>
      <div class="page-view" id="page-purchase"></div>
      <div class="page-view" id="page-notifications"></div>
      <div class="page-view" id="page-log"></div>
      <div class="page-view" id="page-roles"></div>
      <div class="page-view" id="page-import"></div>
      <div class="page-view" id="page-settings"></div>
    </div>
  </main>
</div>
<dialog id="wmsDialog" class="wms-dialog" aria-label="WMS 操作視窗"></dialog>
<script>
(function(){
  const html=document.documentElement;
  const themeBtn=document.getElementById('themeBtn');
  const storedTheme=localStorage.getItem('bomb-wms-theme');
  if(storedTheme==='dark'||storedTheme==='light')html.dataset.theme=storedTheme;
  function themeIcon(){themeBtn.textContent=html.dataset.theme==='dark'?'☀':'☾'}
  themeIcon();
  themeBtn.addEventListener('click',()=>{html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';localStorage.setItem('bomb-wms-theme',html.dataset.theme);themeIcon()});

  const accountBtn=document.getElementById('accountBtn');
  const accountPanel=document.getElementById('accountPanel');
  accountBtn.addEventListener('click',()=>{accountPanel.hidden=!accountPanel.hidden;accountBtn.setAttribute('aria-expanded',String(!accountPanel.hidden))});
  document.addEventListener('click',event=>{if(!event.target.closest('.account-area')){accountPanel.hidden=true;accountBtn.setAttribute('aria-expanded','false')}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!accountPanel.hidden){accountPanel.hidden=true;accountBtn.setAttribute('aria-expanded','false');accountBtn.focus()}});

  const directTabs=[...document.querySelectorAll('.sheet-tab[data-page]')];
  const groupTabs=[...document.querySelectorAll('.sheet-tab[data-group]')];
  const childTabs=[...document.querySelectorAll('.child-tab')];
  const subtabBar=document.querySelector('.sheet-subtabs');
  let currentPage='dashboard';
  function showPage(page,group){
    const main=group?groupTabs.find(t=>t.dataset.group===group):directTabs.find(t=>t.dataset.page===page);
    const child=group?childTabs.find(t=>t.dataset.parent===group&&t.dataset.page===page):null;
    if(!main||!document.getElementById('page-'+page))return;
    [...directTabs,...groupTabs,...childTabs].forEach(tab=>{const active=tab===main||tab===child;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active))});
    document.querySelectorAll('.sheet-children').forEach(row=>row.hidden=row.dataset.children!==group);
    subtabBar.hidden=!group;
    document.querySelectorAll('.page-view').forEach(view=>view.classList.toggle('active',view.id==='page-'+page));
    currentPage=page;
    main.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }
  directTabs.forEach(t=>t.addEventListener('click',()=>showPage(t.dataset.page,null)));
  groupTabs.forEach(t=>t.addEventListener('click',()=>{const child=childTabs.find(x=>x.dataset.parent===t.dataset.group);if(child)showPage(child.dataset.page,t.dataset.group)}));
  childTabs.forEach(t=>t.addEventListener('click',()=>showPage(t.dataset.page,t.dataset.parent)));

  const iconPaths=[
    '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
    '<path d="M3 7h18M5 7V4h14v3M5 7v13h14V7M9 12h6"/>',
    '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',
    '<path d="M12 3v12m0 0-4-4m4 4 4-4M4 17h16v4H4z"/>',
    '<path d="M4 7h15m0 0-4-4m4 4-4 4M20 17H5m0 0 4-4m-4 4 4 4"/>',
    '<path d="M8 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3m8-14h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3M8 12h8m0 0-3-3m3 3-3 3"/>',
    '<path d="M14 4a5 5 0 0 0-6 6L4 14l6 6 4-4a5 5 0 0 0 6-6l-4 4-4-4 4-4z"/>',
    '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/>',
    '<path d="M12 3 3 8v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/>',
    '<path d="M4 7h3l2 2 4-4M4 16h3l2 2 4-4M16 7h4M16 16h4"/>',
    '<path d="M3 5h2l2 11h11l3-8H6M9 21h.01M18 21h.01"/>',
    '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
    '<path d="M7 3h10M7 7h10M7 11h10M7 15h10M7 19h10M3 3h.01M3 7h.01M3 11h.01M3 15h.01M3 19h.01"/>',
    '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0M18 8h4M20 6v4"/>',
    '<path d="M7 3v12m0 0-4-4m4 4 4-4M17 21V9m0 0-4 4m4-4 4 4M3 20h8M13 4h8"/>',
    '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1A7 7 0 0 0 14 5l-.4-2h-4L9.2 5a7 7 0 0 0-2.6 2l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 .1-1z"/>'
  ];
  const iconNames=['dashboard','items','inventory','assets','inbound','transfer','borrow','repair','machine','racks','count','purchase','notifications','log','roles','import','settings'];
  document.querySelectorAll('[data-icon]').forEach(icon=>{const path=iconPaths[iconNames.indexOf(icon.dataset.icon)];if(path)icon.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+path+'</svg>'});

  const KEY='bomb-wms-prototype-v2';
  const seed=()=>({version:2,
    items:[
      {id:'ITM-0001',name:'Mini PC',type:'設備',category:'電腦設備',unit:'台',safety:1,enabled:true},
      {id:'ITM-0002',name:'小螢幕',type:'設備',category:'電腦周邊',unit:'台',safety:2,enabled:true},
      {id:'ITM-0003',name:'滑鼠',type:'消耗品',category:'電腦周邊',unit:'個',safety:10,enabled:true},
      {id:'ITM-0004',name:'鍵盤',type:'消耗品',category:'電腦周邊',unit:'個',safety:5,enabled:true}
    ],
    locations:[
      {id:'LOC-A01',department:'辦公室部門',area:'備品區',spot:'倉架 A-01／第 1 層'},
      {id:'LOC-A02',department:'辦公室部門',area:'備品區',spot:'倉架 A-02／第 2 層'},
      {id:'LOC-B01',department:'辦公室部門',area:'備品區',spot:'倉架 B-01／第 1 層'},
      {id:'LOC-B02',department:'辦公室部門',area:'備品區',spot:'倉架 B-02／第 2 層'},
      {id:'LOC-M01',department:'辦公室部門',area:'機台區',spot:'機台 01'},
      {id:'LOC-O01',department:'辦公室部門',area:'辦公區',spot:'辦公桌 01'},
      {id:'LOC-H01',department:'總部',area:'辦公區',spot:'辦公桌 H-01'},
      {id:'LOC-R01',department:'辦公室部門',area:'備品區',spot:'待檢／維修區'},
      {id:'LOC-F01',department:'辦公室部門',area:'備品區',spot:'故障品區'}
    ],
    assets:[
      {id:'AST-0001',itemId:'ITM-0001',locationId:'LOC-A01',status:'可用',holder:''},
      {id:'AST-0002',itemId:'ITM-0001',locationId:'LOC-M01',status:'使用中',holder:'機台 01'},
      {id:'AST-0003',itemId:'ITM-0002',locationId:'LOC-R01',status:'待檢測',holder:''},
      {id:'AST-0004',itemId:'ITM-0001',locationId:'LOC-F01',status:'故障',holder:''},
      {id:'AST-0005',itemId:'ITM-0002',locationId:'LOC-A02',status:'可用',holder:''}
    ],
    stock:[{itemId:'ITM-0003',locationId:'LOC-B01',qty:12},{itemId:'ITM-0004',locationId:'LOC-B02',qty:5}],
    inbound:[],transfers:[],borrows:[],repairs:[],counts:[],purchases:[],logs:[]
  });
  let db;
  try{db=JSON.parse(localStorage.getItem(KEY)||'null');if(!db||db.version!==2)db=seed()}catch(e){db=seed()}
  function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
  function E(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function item(id){return db.items.find(x=>x.id===id)}
  function loc(id){return db.locations.find(x=>x.id===id)}
  function asset(id){return db.assets.find(x=>x.id===id)}
  function labelLoc(id){const x=loc(id);return x?`${x.department}／${x.area}／${x.spot}`:'－'}
  function itemName(id){return item(id)?.name||id}
  function stamp(){return new Date().toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
  function code(prefix,collection){let n=collection.reduce((max,x)=>Math.max(max,Number(x.id.split('-')[1])||0),0)+1;return prefix+'-'+String(n).padStart(4,'0')}
  function log(action,subject,from,to,ref=''){db.logs.unshift({id:code('LG',db.logs),time:stamp(),action,subject,from,to,who:'OG',ref})}
  function available(id){const x=item(id);return x?.type==='設備'?db.assets.filter(a=>a.itemId===id&&a.status==='可用').length:db.stock.filter(r=>r.itemId===id).reduce((n,r)=>n+r.qty,0)}
  function warnings(){return db.items.filter(x=>x.enabled&&available(x.id)<x.safety)}
  function syncAutoPurchases(){
    let changed=false;
    const open=['待叫貨','已叫貨','無須叫貨','待審核','已核准','部分入庫'];
    for(const x of db.items){
      const shortage=x.enabled?Math.max(0,x.safety-available(x.id)):0;
      const pending=db.purchases.find(p=>p.itemId===x.id&&open.includes(p.status));
      if(x.enabled&&shortage>0&&!pending){
        const locationId=db.assets.find(a=>a.itemId===x.id)?.locationId||db.stock.find(r=>r.itemId===x.id)?.locationId;
        const id=code('PR',db.purchases);
        db.purchases.unshift({id,time:stamp(),department:loc(locationId)?.department||'辦公室部門',itemId:x.id,qty:shortage,received:0,reason:`低於安全庫存（目前可用 ${available(x.id)}，門檻 ${x.safety}）`,who:'系統',source:'低庫存自動產生',status:'待叫貨'});
        log('低庫存產生需求',`${x.name} × ${shortage}`,'－','待叫貨',id);changed=true;
      }else if(pending?.source==='低庫存自動產生'&&pending.status==='待叫貨'){
        if(shortage===0){pending.status='已解除';log('解除低庫存需求',x.name,'待叫貨','已解除',pending.id);changed=true}
        else if(!pending.qtyManual&&pending.qty!==shortage){pending.qty=shortage;pending.reason=`低於安全庫存（目前可用 ${available(x.id)}，門檻 ${x.safety}）`;changed=true}
      }
    }
    if(changed)localStorage.setItem(KEY,JSON.stringify(db));
  }
  function badge(value){const color={'可用':'success','正常':'success','已完成':'success','已歸還':'success','已入庫':'success','已核准':'success','已入庫':'success','已解除':'success','無須叫貨':'info','待驗收':'warning','部分驗收':'warning','驗收不合格':'danger','啟用':'success','使用中':'info','借用中':'info','待處理':'warning','待審核':'warning','待叫貨':'warning','部分入庫':'warning','待檢測':'warning','維修中':'warning','低於安全庫存':'warning','故障':'danger','待報廢':'danger'}[value]||'info';return `<span class="badge badge-${color}">${E(value)}</span>`}
  function cell(value){return `<td>${E(value)}</td>`}
  function button(action,text,id='',extra=''){return `<button type="button" class="btn wms-small-btn" data-action="${E(action)}" data-id="${E(id)}" ${extra}>${E(text)}</button>`}
  function row(cells){return '<tr>'+cells.join('')+'</tr>'}
  function table(id,heads,rows){return `<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody id="${id}">${rows||`<tr><td colspan="${heads.length}" class="wms-empty">尚無資料</td></tr>`}</tbody></table></div>`}
  function header(title,desc,actions=''){return `<section class="page-header"><div class="page-title"><h1>${E(title)}</h1><p>${E(desc)}</p></div><div class="header-actions">${actions}</div></section>`}
  function card(title,sub,body){return `<article class="card"><div class="card-header"><div><h2>${E(title)}</h2><span>${E(sub)}</span></div></div>${body}</article>`}
  function page(key,title,desc,heads,rows,actions='',sub='資料儲存在目前瀏覽器'){document.getElementById('page-'+key).innerHTML=header(title,desc,actions)+card(title+'清單',sub,table('rows-'+key,heads,rows))}
  function choices(items,show){return items.map(x=>({value:x.id,label:show(x)}))}
  function optionsHtml(values,selected=''){return values.map(v=>`<option value="${E(v.value)}" ${String(v.value)===String(selected)?'selected':''}>${E(v.label)}</option>`).join('')}
  function locationOptions(){return choices(db.locations,x=>labelLoc(x.id))}
  function itemOptions(type){return choices(db.items.filter(x=>x.enabled&&(!type||x.type===type)),x=>`${x.id} ${x.name}`)}
  function assetOptions(predicate=()=>true){return choices(db.assets.filter(predicate),a=>`${a.id} ${itemName(a.itemId)}（${a.status}・${labelLoc(a.locationId)}）`)}
  function field(name,label,type='text',values=[],value='',required=true){return {name,label,type,values,value,required}}
  const dialog=document.getElementById('wmsDialog');
  let submitDialog=null;
  function form(title,fields,submit){
    const controls=fields.map(f=>`<label class="wms-field"><span>${E(f.label)}</span>${f.type==='select'?`<select name="${E(f.name)}" ${f.required?'required':''}><option value="">請選擇</option>${optionsHtml(f.values,f.value)}</select>`:`<input name="${E(f.name)}" type="${E(f.type)}" value="${E(f.value)}" ${f.type==='number'?'min="0" step="1"':''} ${f.required?'required':''}>`}</label>`).join('');
    dialog.innerHTML=`<form id="wmsForm"><h2>${E(title)}</h2><div class="wms-form-grid">${controls}</div><p id="formError" class="wms-form-error" role="alert"></p><div class="wms-dialog-actions"><button type="button" class="btn" data-action="close-dialog">取消</button><button type="submit" class="btn btn-primary">儲存</button></div></form>`;
    submitDialog=submit;dialog.showModal();
  }
  dialog.addEventListener('submit',event=>{event.preventDefault();if(!submitDialog)return;const values=Object.fromEntries(new FormData(event.target));try{submitDialog(values);dialog.close();submitDialog=null;save()}catch(e){document.getElementById('formError').textContent=e.message||'資料無法儲存'}});

      return `<td data-label="${kind==='ordered'?'已叫貨':'無須叫貨'}"><label class="wms-check-cell"><input type="checkbox" data-action="${kind==='ordered'?'toggle-order':'toggle-no-order'}" data-id="${E(r.id)}" ${checked?'checked':''} ${terminal?'disabled':''} aria-label="${E(itemName(r.itemId))} ${kind==='ordered'?'已叫貨':'無須叫貨'}"></label></td>`;
    };
    const purchaseRows=db.purchases.length?db.purchases.map(r=>`<tr>
      <td data-label="品項"><strong>${E(itemName(r.itemId))}</strong><small>${E(r.id)}</small></td>
      <td data-label="叫貨數量"><label class="wms-qty-control"><input type="number" min="1" step="1" value="${E(r.qty)}" data-action="order-qty" data-id="${E(r.id)}" ${['待審核','部分入庫','已入庫','已解除','無須叫貨'].includes(r.status)?'disabled':''} aria-label="${E(itemName(r.itemId))} 叫貨數量"><span>${E(item(r.itemId)?.unit||'')}</span></label></td>
      ${orderCell(r,'ordered')}${orderCell(r,'no-order')}
      <td data-label="狀態">${badge(r.status)}</td>
      <td data-label="來源／部門">${E(r.source||'人工申請')}<small>${E(r.department)}</small></td>
      <td data-label="原因">${E(r.reason)}</td>
      <td data-label="操作">${r.status==='待審核'?button('approve-purchase','核准',r.id):'－'}</td>
    </tr>`).join(''):'';
    page('purchase','採購需求','低庫存自動列入；調整數量後選已叫貨或無須叫貨',['品項','叫貨數量','已叫貨','無須叫貨','狀態','來源／部門','原因','操作'],purchaseRows,actions(['new-purchase','＋ 新增需求']),'勾選只儲存在目前裝置的瀏覽器；到貨後請先登記，再到驗收頁面確認');
    const notes=[...warnings().map(x=>({type:'庫存預警',text:`${x.name} 可用 ${available(x.id)} ${x.unit}，低於安全庫存 ${x.safety} ${x.unit}`,ref:x.id})),...db.purchases.filter(p=>['待審核','待叫貨'].includes(p.status)).map(p=>({type:p.status==='待叫貨'?'待叫貨':'待審核採購',text:`${p.department} 申請 ${itemName(p.itemId)} × ${p.qty}`,ref:p.id})),...db.assets.filter(a=>['故障','待檢測','維修中'].includes(a.status)).map(a=>({type:'設備狀態',text:`${a.id} ${itemName(a.itemId)}：${a.status}`,ref:a.id}))];
    page('notifications','通知中心','依最新庫存、採購及設備狀態即時計算提醒',['類型','通知內容','關聯編號','狀態'],formatRows(notes,[n=>cell(n.type),n=>cell(n.text),n=>cell(n.ref),n=>`<td>${badge('待處理')}</td>`]));
    page('log','異動日誌','記錄本機展示資料的操作人、前後狀態與關聯單號',['時間','動作','品項／資產','異動前','異動後','操作人','關聯單號'],formatRows(db.logs,[r=>cell(r.time),r=>cell(r.action),r=>cell(r.subject),r=>cell(r.from),r=>cell(r.to),r=>cell(r.who),r=>cell(r.ref||'－')]));
    page('roles','角色與權限','權限表為規劃草稿；展示帳號尚無登入驗證',['角色','查看資料','品項／位置維護','入出庫／調撥','核准','系統設定'],row(['最高權限','全部','可','可','可','可'].map(cell))+row(['部門主管','所屬部門','依授權','可','依授權','不可'].map(cell))+row(['一般使用者','授權範圍','不可','提出申請','不可','不可'].map(cell)));
    page('import','匯入／匯出','以 JSON 備份或還原目前瀏覽器的展示資料',['項目','用途','資料格式'],row(['匯出資料','保存品項、位置、資產、庫存及異動紀錄','JSON'].map(cell))+row(['匯入資料','還原相同格式的備份檔','JSON'].map(cell)),actions(['export','下載備份'],['import','匯入備份']));
    const departments=['總部','辦公室部門'];
    page('settings','系統設定','目前展示資料使用此分類與規則',['設定','目前內容','用途'],row(['部門',departments.join('、'),'物品、資產與位置的歸屬'].map(cell))+row(['辦公室部門區域','機台區、辦公區、備品區','管理實際位置'].map(cell))+row(['安全庫存','依品項設定；全公司可用數低於門檻即提醒','通知中心與採購需求'].map(cell))+row(['資料保存','目前瀏覽器 localStorage','重新開啟仍保留；可匯出備份'].map(cell)));
    const total=db.assets.length,ready=db.assets.filter(a=>a.status==='可用').length,using=db.assets.filter(a=>['使用中','借用中'].includes(a.status)).length,repairing=db.assets.filter(a=>['故障','待檢測','維修中'].includes(a.status)).length,low=warnings().length;
    const stats=[['公司資產總數',total,'已登錄設備資產'],['可用設備',ready,'可立即配置'],['使用中／借用中',using,'目前不可配置'],['故障／維修',repairing,'待檢測或處理'],['庫存預警',low,'低於安全庫存的品項']].map(([name,value,note])=>`<article class="stat-card"><div class="stat-head"><span class="stat-label">${E(name)}</span><span class="stat-icon">▦</span></div><div class="stat-value">${value}</div><div class="stat-note">${E(note)}</div></article>`).join('');
    const recent=formatRows(db.logs.slice(0,5),[r=>cell(r.time),r=>cell(r.action),r=>cell(r.subject),r=>cell(r.from),r=>cell(r.to),r=>cell(r.who)]);
    const alerts=notes.slice(0,5).map(n=>`<div class="alert-item"><div class="alert-icon">!</div><div class="alert-content"><div class="alert-title">${E(n.type)}</div><div class="alert-desc">${E(n.text)}</div></div></div>`).join('')||'<p class="wms-empty">目前沒有待處理提醒</p>';
    document.getElementById('page-dashboard').innerHTML=header('營運總覽','公司設備與庫存目前概況',actions(['refresh','重新整理'],['new-item','＋ 新增品項']))+`<section class="stats-grid">${stats}</section><section class="dashboard-grid"><div>${card('資產狀態分布','以目前資產資料計算',`<div class="card-body"><div class="status-list">${[['可用',ready,'success'],['使用中／借用中',using,''],['故障／待檢測／維修中',repairing,'warning']].map(([n,v,c])=>`<div class="status-row"><div class="status-name">${n}</div><div class="progress"><div class="progress-bar ${c}" style="width:${total?Math.round(v/total*100):0}%"></div></div><div class="status-number">${v}</div></div>`).join('')}</div></div>`)}<br>${card('最近異動','最新五筆操作紀錄',table('dashboard-log',['時間','異動類型','品項／資產','原位置','新位置','操作人'],recent))}<div class="wms-card-footer">${button('go-log','查看全部')}</div></div><div>${card('待處理／通知','與目前資料連動',`<div class="card-body"><div class="alert-list">${alerts}</div></div>`)}<br>${card('快速操作','常用 WMS 作業',`<div class="card-body quick-actions">${[['new-inbound','新增入庫'],['new-transfer-asset','調撥設備'],['new-purchase','採購需求'],['new-count','開始盤點']].map(([a,t])=>button(a,t)).join('')}</div>`)}</div></section>`;
    const bell=document.getElementById('notificationBadge');if(bell)bell.hidden=!notes.length;
    filterItems();
  }
  function filterItems(){const search=document.getElementById('itemSearch'),type=document.getElementById('itemTypeFilter'),status=document.getElementById('itemStatusFilter');if(!search)return;const q=search.value.trim().toLowerCase();document.querySelectorAll('#rows-items tr').forEach(tr=>{const t=tr.querySelectorAll('td');if(!t.length)return;tr.hidden=!((t[0].textContent.toLowerCase().includes(q)||t[1].textContent.toLowerCase().includes(q))&&(!type.value||t[2].textContent===type.value)&&(!status.value||t[6].textContent===status.value))})}
  document.addEventListener('input',e=>{if(e.target.id==='itemSearch')filterItems()});
  document.addEventListener('change',e=>{if(['itemTypeFilter','itemStatusFilter'].includes(e.target.id))filterItems();if(e.target.dataset.action==='order-qty'){try{updateOrderQty(e.target.dataset.id,e.target.value)}catch(error){alert(error.message);renderAll()}}});
  function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BOMB-WMS-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const value=JSON.parse(await file.text());if(value.version!==2||!['items','locations','assets','stock','inbound','transfers','borrows','repairs','counts','purchases','logs'].every(k=>Array.isArray(value[k])))throw Error('備份檔格式不符');if(!confirm('匯入會覆蓋目前瀏覽器的 WMS 展示資料，確定繼續？'))return;db=value;save()}catch(e){alert('匯入失敗：'+e.message)}});input.click()}
  const handlers={'new-item':addItem,'new-inbound':inbound,'new-transfer-asset':transferAsset,'new-transfer-stock':transferStock,'new-borrow':borrow,'new-repair':repair,'new-replacement':replaceAsset,'new-count':countStock,'new-purchase':purchase,'new-location':addLocation,'refresh':renderAll,'go-log':()=>showPage('log','operations'),'go-notifications':()=>showPage('notifications','operations'),'export':exportData,'import':importData,'close-dialog':()=>dialog.close()};
  document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;if(handlers[action])handlers[action]();else if(action==='edit-item')editItem(id);else if(action==='return-asset')returnAsset(id);else if(action==='finish-repair')finishRepair(id);else if(action==='approve-purchase')approve(id);else if(action==='inspect-inbound')inspectInbound(id);else if(action==='toggle-order')setOrderDecision(id,'ordered',target.checked);else if(action==='toggle-no-order')setOrderDecision(id,'no-order',target.checked)});
  renderAll();
})();
</script>
</body>
